# Arma la app de Android y la publica en "Releases" para descargarla desde el celular.
name: App de Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx cap sync android
      - name: Armar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ritmo.apk
      - name: Publicar para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Ritmo para Android
          body: |
            Descarga **ritmo.apk** desde el celular e instálalo.
            Versión 1.${{ github.run_number }}.
          files: ritmo.apk
          make_latest: true
