<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ritmi Tareas</title>
<meta name="theme-color" content="#F7F1F6">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ritmi Tareas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Outfit:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F7F1F6; --surface:#FFFFFF; --sunk:#EFE6EE; --ink:#241B28; --muted:#6E6272; --line:#E6DAE4;
  --accent:#6F48C9; --accent-soft:#ECE4FB; --accent-ink:#FFFFFF;
  --rose:#D9487A; --rose-soft:#FBE3EC; --ok:#2C7A4B; --ok-soft:#DAEEDF;
  --display:"Outfit","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:16px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding:env(safe-area-inset-top,0px) 0 calc(84px + env(safe-area-inset-bottom,0px));min-height:100vh;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:1.85rem;font-weight:700}
h2{font-size:1.2rem;font-weight:700}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}

/* Encabezado */
header{display:flex;align-items:center;gap:12px;padding:18px 0 10px}
header .hi{flex:1;min-width:0}
header .date{font-size:.92rem;color:var(--muted)}header .date::first-letter{text-transform:uppercase}
#mascot{background:none;border:0;padding:0;min-height:0;cursor:pointer}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.pill{font-size:.85rem;padding:5px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.pill b{color:var(--ink)}
.pill.hot{background:#FDE3E1;border-color:#F3BDB8;color:#9C2A22}.pill.hot b{color:#9C2A22}

/* Botones */
button,.btn{font:inherit;font-weight:700;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;cursor:pointer;min-height:44px}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ghost{background:transparent}
.danger{color:#B03E36}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}

/* Tarjeta de lo que está haciendo */
.now{background:var(--accent);color:#fff;border-radius:20px;padding:16px 18px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 24px rgba(111,72,201,.25)}
.now .label{color:rgba(255,255,255,.8)}
.now h2{font-size:1.25rem}
.now .timer{font-family:var(--mono);font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.now button{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
.now button.solid{background:#fff;color:var(--accent);border-color:#fff}

/* Secciones y tarjetas de tarea */
.sec{margin:18px 0 8px;display:flex;align-items:baseline;justify-content:space-between}
.list{display:flex;flex-direction:column;gap:10px}
.task{--h:145;--a:.0;position:relative;display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px;overflow:hidden;
  background-image:linear-gradient(90deg,hsla(var(--h),78%,52%,var(--a)),transparent 70%)}
.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:hsl(var(--h),70%,50%)}
.task.late{border-color:#E9A7A1}
.task.late::before{background:#B5261B}
.task.doing{outline:2.5px solid var(--accent);outline-offset:-1px}
.check{flex:none;width:30px;height:30px;min-height:30px;border-radius:50%;border:2.5px solid #BDB0BF;background:#fff;padding:0;margin-top:1px;display:grid;place-items:center}
.check svg{opacity:0}
.task.done .check{background:var(--ok);border-color:var(--ok)}.task.done .check svg{opacity:1}
.task .body{flex:1;min-width:0;cursor:pointer}
.task .t{font-weight:700;font-size:1.02rem;line-height:1.3;word-wrap:break-word}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:.85rem;color:var(--muted);align-items:center}
.due{font-weight:700;color:hsl(var(--h),65%,30%)}
.task.late .due{color:#B5261B}
.tag{display:inline-flex;align-items:center;gap:4px}
.dots{letter-spacing:1px;color:var(--accent)}
.imp2{color:var(--rose);font-weight:700}
.play{flex:none;width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.note{font-size:.85rem;color:var(--muted);margin-top:4px;white-space:pre-wrap}
.first{display:block;margin-bottom:2px;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--rose)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:1.15rem;margin:8px 0 2px}
.more{width:100%;background:transparent;border-style:dashed;color:var(--muted);font-weight:400}

/* Tarjetas generales */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h2{margin-bottom:10px}
.big{font-family:var(--display);font-size:2rem;font-weight:700;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats div span{display:block;font-size:.8rem;color:var(--muted);margin-top:4px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:110px;margin-top:6px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:.72rem;color:var(--muted)}
.bar i{display:block;width:100%;max-width:28px;background:var(--accent);border-radius:6px 6px 3px 3px;min-height:3px}
.bar.today i{background:var(--rose)}
.avg{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)}
.avg:first-of-type{border-top:0}
.hist{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:.92rem}
.hist .ok{color:var(--ok);font-weight:700}.hist .bad{color:#B5261B;font-weight:700}

/* Ajustes */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>span{font-weight:700;font-size:.92rem}
input[type=text],input[type=date],input[type=time],textarea{font:inherit;font-size:16px;width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);min-height:46px;-webkit-appearance:none;appearance:none}
input[type=date],input[type=time]{display:block}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{font-weight:400;padding:8px 6px;font-size:.92rem}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border-radius:99px;min-height:34px;padding:5px 12px;font-weight:400;font-size:.88rem}
.chips button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:#fff;text-align:left;width:100%;font-weight:400}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt b{display:block}
.opt .r{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid #BDB0BF;margin-top:2px}
.opt.on .r{border:6px solid var(--accent)}
.hint{background:var(--accent-soft);border:1px solid #D9CCF5;border-radius:var(--r);padding:14px;margin-bottom:12px;font-size:.92rem}
.hint ol{margin:6px 0 0;padding-left:20px}
.ver{text-align:center;color:var(--muted);font-size:.8rem;margin:20px 0}

/* Hoja para crear/editar */
#sheet-bg{position:fixed;inset:0;background:rgba(30,20,35,.45);z-index:40}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;
  padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.2)}
#sheet .grab{width:40px;height:5px;border-radius:9px;background:#D6C9D4;margin:0 auto 12px}
#sheet .in{max-width:560px;margin:0 auto}
#sheet h2{margin-bottom:14px}

/* Barra de abajo */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:700;color:var(--muted);padding:4px 14px;min-height:50px}
nav.tabs button.on{color:var(--accent)}
#fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:31;width:60px;height:60px;border-radius:20px;background:var(--accent);color:#fff;border:0;
  box-shadow:0 8px 20px rgba(111,72,201,.4);display:grid;place-items:center;padding:0}

/* Mensajes */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:#fff;padding:10px 14px;border-radius:12px;font-size:.92rem;
  display:flex;gap:12px;align-items:center;width:max-content;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast button{background:transparent;border:0;color:#C9B5F7;min-height:30px;padding:2px 4px}
.alert{background:#FDE3E1;border:1px solid #F3BDB8;color:#7A1F18;border-radius:var(--r);padding:12px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center}
.alert .grow b{display:block}
.alert button{min-height:36px;padding:6px 10px;font-size:.88rem}

/* Ritmi */
.ritmi .eyes ellipse{transform-origin:center;transform-box:fill-box}
.hop{animation:hop .55s cubic-bezier(.3,1.6,.5,1) 1}
@keyframes hop{40%{transform:translateY(-8px) scale(1.04)}}
.burst{position:fixed;z-index:70;pointer-events:none;font-size:22px;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){.hop,.burst{animation:none}}
</style>

  <header>
    <div class="hi"><h1 id="hello">Hola</h1><div class="date" id="dateline"></div></div>

  </header>
  <main id="view"></main>
</div>
