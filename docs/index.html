<style>
/* Layout: una columna tranquila (máx. 720px), navegación fija abajo, una sola cosa grande arriba: "Ahora". */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunk:#E3E9E6; --ink:#17201D; --muted:#5A6863; --line:#D3DCD8;
  --accent:#1E6B5B; --accent-soft:#D3EAE3; --accent-ink:#FFFFFF;
  --warm:#B8681F; --warm-soft:#F5E2CC; --risk:#B03E36; --risk-soft:#F6DCD9; --ok:#2C7A4B; --ok-soft:#DAEEDF;
  --night:#4A4E9C; --night-soft:#E1E2F4; --class:#2B4C78; --class-soft:#DCE5F1; --neutral-soft:#E7EAE8;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#17201D; --sunk:#111917; --ink:#E4ECE9; --muted:#97A7A1; --line:#2A3632;
  --accent:#62C3AB; --accent-soft:#1B3A33; --accent-ink:#06150F;
  --warm:#E5A35F; --warm-soft:#3A2A19; --risk:#EB8279; --risk-soft:#3D1F1C; --ok:#72C793; --ok-soft:#18321F;
  --night:#A5A9F2; --night-soft:#23254A; --class:#9DBDE8; --class-soft:#1C2A3E; --neutral-soft:#1F2926;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#17201D; --sunk:#111917; --ink:#E4ECE9; --muted:#97A7A1; --line:#2A3632;
  --accent:#62C3AB; --accent-soft:#1B3A33; --accent-ink:#06150F;
  --warm:#E5A35F; --warm-soft:#3A2A19; --risk:#EB8279; --risk-soft:#3D1F1C; --ok:#72C793; --ok-soft:#18321F;
  --night:#A5A9F2; --night-soft:#23254A; --class:#9DBDE8; --class-soft:#1C2A3E; --neutral-soft:#1F2926;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px calc(92px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(1.9rem,6vw,2.6rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.mono,.time{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.clock{font-family:var(--mono);font-size:1rem;color:var(--muted)}
.sync{font-size:.78rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--ok)} .dot.warn{background:var(--warm)}

/* Ahora */
.now{border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);background:var(--surface)}
.now .kind{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.now h2{font-size:clamp(1.6rem,5.5vw,2.2rem)}
.now.t-task{background:var(--accent-soft);border-color:transparent}.now.t-task .kind{color:var(--accent)}
.now.t-rest,.now.t-free,.now.t-open{background:var(--ok-soft);border-color:transparent}.now.t-rest .kind,.now.t-free .kind,.now.t-open .kind{color:var(--ok)}
.now.t-class{background:var(--class-soft);border-color:transparent}.now.t-class .kind{color:var(--class)}
.now.t-sleep,.now.t-wind{background:var(--night-soft);border-color:transparent}.now.t-sleep .kind,.now.t-wind .kind{color:var(--night)}
.now.t-commit,.now.t-job{background:var(--warm-soft);border-color:transparent}.now.t-commit .kind,.now.t-job .kind{color:var(--warm)}
.now.t-commute,.now.t-meal,.now.t-routine{background:var(--neutral-soft);border-color:transparent}
.timer{font-family:var(--mono);font-size:clamp(2.4rem,10vw,3.4rem);font-variant-numeric:tabular-nums;line-height:1}
.ideas{display:flex;gap:8px;flex-wrap:wrap}
.idea{font-size:.85rem;padding:4px 10px;border-radius:99px;background:var(--surface);color:var(--muted)}

/* Botones */
button,.btn{font:inherit;font-weight:700;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;cursor:pointer;min-height:44px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ghost{background:transparent}
.danger{color:var(--risk)}
.small{min-height:34px;padding:6px 10px;font-size:.88rem}
.chip{border-radius:99px;min-height:36px;padding:6px 12px;font-weight:400;font-size:.92rem}
.chip.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.quick button{text-align:left;display:flex;flex-direction:column;gap:2px;padding:12px 14px}
.quick button span{font-weight:400;font-size:.82rem;color:var(--muted)}
.quick button.on{background:var(--warm-soft);border-color:var(--warm)}

/* Timeline */
.tl{display:flex;flex-direction:column;gap:6px}
.blk{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:stretch}
.blk .t{font-family:var(--mono);font-size:.82rem;color:var(--muted);padding-top:10px;font-variant-numeric:tabular-nums}
.blk .b{border-radius:11px;padding:9px 12px;background:var(--neutral-soft);min-width:0;display:flex;flex-direction:column;gap:2px}
.blk .b strong{font-weight:700}
.blk .b small{color:var(--muted)}
.blk.past{opacity:.5}
.blk.cur .b{outline:2px solid var(--ink)}
.b.t-task{background:var(--accent-soft)} .b.t-class{background:var(--class-soft)} .b.t-rest,.b.t-free,.b.t-open{background:var(--ok-soft)}
.b.t-sleep,.b.t-wind{background:var(--night-soft)} .b.t-commit,.b.t-job{background:var(--warm-soft)}
.b.t-open{background:transparent;border:1px dashed var(--line)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.days button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 12px;font-weight:400}
.days button b{font-family:var(--display);font-size:1.2rem}
.days button.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Tareas */
.task{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.pill{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.p-bien{background:var(--ok-soft);color:var(--ok)} .p-ajustado{background:var(--warm-soft);color:var(--warm)}
.p-riesgo{background:var(--risk-soft);color:var(--risk)} .p-casi{background:var(--class-soft);color:var(--class)}
.p-ej{background:var(--sunk);color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter{position:relative;display:grid;grid-template-columns:40% 30% 30%;height:10px;border-radius:99px;overflow:visible;margin-top:4px}
.meter .z{display:block;height:100%}.meter .z1{background:var(--ok-soft);border-radius:99px 0 0 99px}.meter .z2{background:var(--warm-soft)}.meter .z3{background:var(--risk-soft);border-radius:0 99px 99px 0}
.meter i{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--ink)}
.meter-lab{display:grid;grid-template-columns:40% 30% 22% 8%;font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.alert{border-radius:var(--r);padding:14px 16px;background:var(--risk-soft);color:var(--ink);display:flex;flex-direction:column;gap:6px}
.alert.warn{background:var(--warm-soft)}
.alert.calm{background:var(--accent-soft)}

/* Formularios */
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted);min-width:0;flex:none}
.grid2>label.f,.row>label.f{flex:1 1 140px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px;width:100%;min-width:0}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
.grid2{display:flex;gap:10px;flex-wrap:wrap}
.check{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:1rem;color:var(--ink);cursor:pointer}
.check:first-child{border-top:0}
.sched{display:grid;grid-template-columns:1.1fr .9fr .9fr 2fr 1fr auto;gap:6px;align-items:center;min-width:620px}
.scroll{overflow-x:auto}

/* Gráficas */
svg text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.hgrid{display:grid;grid-template-columns:150px repeat(14,1fr);gap:3px;align-items:center;font-size:.8rem;min-width:420px}
.hgrid i{display:block;aspect-ratio:1;border-radius:4px;background:var(--sunk);max-width:100%}
.hgrid i.y{background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--sunk);border-radius:12px;padding:12px}
.stat b{font-family:var(--display);font-size:1.6rem;display:block}

/* Avisos */
.pop-bg{position:fixed;inset:0;background:rgba(10,15,13,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.pop-bg.small{background:transparent;pointer-events:none;align-items:flex-end;justify-content:flex-end;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.pop{pointer-events:auto;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:18px;padding:20px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.pop-bg.small .pop{max-width:360px}
.pop .kind{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.pop-wind,.pop-bed{border-top-color:var(--night)}.pop-go{border-top-color:var(--warm)}.pop-soft{border-top-color:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center}
/* Pestañas internas */
.seg{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:13px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1 0 auto;border:0;background:transparent;color:var(--muted);min-height:38px;padding:6px 12px;font-size:.9rem;border-radius:10px}
.seg button.sel{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.catrow{display:grid;grid-template-columns:minmax(80px,30%) 1fr auto;gap:10px;align-items:center;font-size:.92rem}
.mini{width:110px;min-height:34px;padding:4px 8px}
.fixrow{gap:8px;padding:10px 0;border-top:1px solid var(--line)}.fixrow:first-child{border-top:0}
.gear{display:inline-flex;width:36px;height:36px;align-items:center;justify-content:center;border-radius:10px;color:var(--muted)}
.gear svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}.gear.sel,.gear:hover{color:var(--accent);background:var(--accent-soft)}
/* Navegación */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;color:var(--muted);text-decoration:none;font-size:.68rem;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs a.sel{color:var(--accent);background:var(--accent-soft)}

/* Hoja modal */
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,13,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px;
  padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:20px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:40;max-width:calc(100% - 32px);font-size:.92rem}
@media (prefers-reduced-motion:no-preference){.now,.card{animation:in .25s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
/* ===== Rediseño: lavanda suave, relieve, colores por tipo ===== */
:root{
  --bg:#ECEBFA; --surface:#F8F7FF; --sunk:#E4E2F6; --ink:#24224A; --muted:#6C6994; --line:#DCD9F1;
  --accent:#5B4FE0; --accent-soft:#E4E1FF; --accent-ink:#FFFFFF;
  --warm:#C96F17; --warm-soft:#FCEAD7; --risk:#CF3D55; --risk-soft:#FBE2E7; --ok:#16946B; --ok-soft:#DCF4EA;
  --night:#4B47B5; --night-soft:#E3E2F8; --class:#2A78C2; --class-soft:#DDEAFA; --neutral-soft:#E8E6F6;
  --shadow:0 12px 32px rgba(91,79,224,.11),0 2px 6px rgba(36,34,74,.06);
  --shadow-sm:0 4px 14px rgba(91,79,224,.10);
  --grad:linear-gradient(135deg,#5B4FE0 0%,#8F56EE 55%,#C065E2 100%);
  --display:"Outfit","Segoe UI",system-ui,sans-serif;
  --r:22px;
  --c-task:#6C5CE7; --c-class:#2F8BDB; --c-free:#1FAF83; --c-rest:#1FAF83; --c-open:#9C98C9; --c-commit:#EF8436; --c-job:#E2A92E;
  --c-sleep:#3D3A8F; --c-wind:#5B4FB8; --c-commute:#8C87C4; --c-meal:#E8668A; --c-routine:#F0B43C;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131129; --surface:#1E1B3C; --sunk:#181533; --ink:#ECEBFF; --muted:#A4A1CB; --line:#2E2A55;
  --accent:#8F86FF; --accent-soft:#2B2662; --accent-ink:#0F0D24;
  --warm:#F2A65A; --warm-soft:#3A2B1E; --risk:#FF7F91; --risk-soft:#3F1E2B; --ok:#5ED3A6; --ok-soft:#173A31;
  --night:#ACA8FF; --night-soft:#27245B; --class:#7FB9F3; --class-soft:#1B2D4A; --neutral-soft:#242046;
  --shadow:0 12px 32px rgba(0,0,0,.38),0 1px 0 rgba(255,255,255,.03) inset;
  --shadow-sm:0 4px 14px rgba(0,0,0,.3);
  --grad:linear-gradient(135deg,#4A3ECF 0%,#7447D9 55%,#A24CCB 100%);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131129; --surface:#1E1B3C; --sunk:#181533; --ink:#ECEBFF; --muted:#A4A1CB; --line:#2E2A55;
  --accent:#8F86FF; --accent-soft:#2B2662; --accent-ink:#0F0D24;
  --warm:#F2A65A; --warm-soft:#3A2B1E; --risk:#FF7F91; --risk-soft:#3F1E2B; --ok:#5ED3A6; --ok-soft:#173A31;
  --night:#ACA8FF; --night-soft:#27245B; --class:#7FB9F3; --class-soft:#1B2D4A; --neutral-soft:#242046;
  --shadow:0 12px 32px rgba(0,0,0,.38),0 1px 0 rgba(255,255,255,.03) inset;
  --shadow-sm:0 4px 14px rgba(0,0,0,.3);
  --grad:linear-gradient(135deg,#4A3ECF 0%,#7447D9 55%,#A24CCB 100%);
  color-scheme:dark}
body{padding-block:14px calc(110px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em}
h2{font-weight:600}

/* Cabecera con degradado */
.wrap>.top{flex-wrap:nowrap;align-items:flex-start!important;background:var(--grad);color:#fff;border-radius:28px;padding:20px 20px 22px;box-shadow:0 14px 34px rgba(91,79,224,.28);position:relative;overflow:hidden;align-items:center}
.wrap>.top::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
.wrap>.top::before{content:"";position:absolute;right:60px;bottom:-60px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.wrap>.top .label,.wrap>.top .clock,.wrap>.top .sync{color:rgba(255,255,255,.82)}
.wrap>.top h1{color:#fff}
.wrap>.top .gear{color:#fff;background:rgba(255,255,255,.16)}
.wrap>.top .gear.sel,.wrap>.top .gear:hover{background:rgba(255,255,255,.3);color:#fff}
.wrap>.top .dot.on{background:#8EF0C8}.wrap>.top .dot.warn{background:#FFD08A}

/* Tarjetas */
.stats{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
.card{border:0;box-shadow:var(--shadow);border-radius:var(--r);padding:20px}
.stat{background:var(--sunk);border-radius:16px;padding:14px}
.stat b{font-family:var(--display);font-weight:600}
.alert{border-radius:18px;box-shadow:var(--shadow-sm)}

/* Botones y campos */
button,.btn{border-radius:14px;border:0;background:var(--sunk);transition:transform .12s ease,box-shadow .12s ease}
button:hover{border-color:transparent;box-shadow:var(--shadow-sm)}
button:active{transform:scale(.97)}
.primary{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(91,79,224,.28)}
.ghost{background:transparent}
.chip{background:var(--sunk);border:0}
.chip.sel{background:var(--grad);color:#fff}
input,select,textarea{background:var(--sunk);border:1px solid transparent;border-radius:14px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.seg{background:var(--sunk);border-radius:16px}
.seg button{background:transparent;box-shadow:none}
.seg button.sel{background:var(--surface);box-shadow:var(--shadow-sm);color:var(--accent);font-weight:700}

/* Ahora: tarjeta grande con degradado por tipo */
.now{border:0;border-radius:28px;padding:24px;color:#fff;box-shadow:0 16px 36px rgba(91,79,224,.22);position:relative;overflow:hidden;background:linear-gradient(135deg,#8C87C4,#B3ACE6)}
.now::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)}
.now>*{position:relative;z-index:1}
.now .kind,.now.t-task .kind,.now.t-free .kind,.now.t-rest .kind,.now.t-open .kind,.now.t-class .kind,.now.t-sleep .kind,.now.t-wind .kind,.now.t-commit .kind,.now.t-job .kind{color:rgba(255,255,255,.85)}
.now .muted,.now .time{color:rgba(255,255,255,.85)}
.now.t-task{background:linear-gradient(135deg,#5B4FE0,#9B5CF0 60%,#C668E6)}
.now.t-class{background:linear-gradient(135deg,#2F7FD8,#4FB3E6)}

.now label.f{color:rgba(255,255,255,.85)}

/* Accesos rápidos: íconos en cuadritos */
.quick{grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:12px}
.quick button{background:transparent;box-shadow:none;align-items:center;text-align:center;padding:4px 2px;gap:6px;font-weight:600;font-size:.88rem;line-height:1.2}
.quick button span{font-size:.74rem;line-height:1.25}
.quick .qi{width:60px;height:60px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--accent);margin-bottom:2px}
.quick .qi svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.quick button:hover .qi{transform:translateY(-2px)}
.quick button.on .qi{background:var(--grad);color:#fff}
.quick button.on{background:transparent}

/* Línea del día: gota de color a la izquierda */
.tl{gap:10px}
.blk{grid-template-columns:62px 1fr;gap:10px}
.blk .t{padding-top:14px;font-size:.78rem}
.blk .b,.blk .b[class*="t-"]{background:var(--surface);box-shadow:var(--shadow-sm);border-radius:18px;padding:10px 14px 10px 0;display:grid;grid-template-columns:48px 1fr;column-gap:12px;row-gap:1px;border:0;overflow:hidden}
.blk .b .ic{grid-row:1 / span 4;align-self:stretch;margin:-10px 0;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--c,var(--c-open));border-radius:0 22px 22px 0}
.blk .b .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.blk .b>strong,.blk .b>small,.blk .b>button{grid-column:2}
.blk .b>button{justify-self:start;margin-top:4px}
.b.t-open{border:0}
.blk .b.t-open{background:transparent;box-shadow:none;outline:1.5px dashed var(--line);outline-offset:-1.5px}
.blk .b.t-open .ic{background:transparent;color:var(--muted)}
.blk.cur .b{outline:2.5px solid var(--accent);outline-offset:1px}
.blk.past{opacity:.45}
.t-task{--c:var(--c-task)}.t-class{--c:var(--c-class)}.t-free{--c:var(--c-free)}.t-rest{--c:var(--c-rest)}.t-commit{--c:var(--c-commit)}.t-job{--c:var(--c-job)}
.t-sleep{--c:var(--c-sleep)}.t-wind{--c:var(--c-wind)}.t-commute{--c:var(--c-commute)}.t-meal{--c:var(--c-meal)}.t-routine{--c:var(--c-routine)}

/* Tira de días: pastillas altas */
.days{gap:10px;padding:4px 2px 10px}
.days button{width:58px;min-height:86px;border-radius:30px;background:var(--surface);box-shadow:var(--shadow-sm);justify-content:center;gap:2px;font-size:.78rem;color:var(--muted)}
.days button b{font-size:1.4rem;color:var(--ink)}
.days button.sel{background:var(--grad);color:rgba(255,255,255,.85);box-shadow:0 10px 22px rgba(91,79,224,.35)}
.days button.sel b{color:#fff}

/* Tareas como tarjetas con gota de color */
.card .task{position:relative;padding:16px 16px 16px 26px;border:0;border-radius:18px;background:var(--sunk);margin-top:10px}
.card .task:first-of-type{margin-top:0}
.card .task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;border-radius:18px 0 0 18px;background:var(--accent)}
.card .task:has(.p-riesgo)::before{background:var(--risk)}
.card .task:has(.p-ajustado)::before{background:var(--warm)}
.card .task:has(.p-bien)::before{background:var(--ok)}
.bar{background:var(--line);height:9px}
.bar i{background:var(--grad)}
.pill{padding:4px 10px}

/* Navegación flotante */
nav.tabs{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border:0;border-radius:26px;background:var(--surface);box-shadow:0 14px 36px rgba(36,34,74,.18);padding:8px}
nav.tabs a{border-radius:18px;padding:8px 0;font-weight:600}
nav.tabs a.sel{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(91,79,224,.3)}

/* Botón flotante + menú rápido */
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--grad);color:#fff;z-index:25;box-shadow:0 12px 28px rgba(91,79,224,.45);display:flex;align-items:center;justify-content:center;padding:0;min-height:0}

.fabmenu .list{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(160px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.fabmenu button{display:flex;align-items:center;gap:12px;background:var(--surface);box-shadow:var(--shadow);border-radius:18px;padding:10px 16px 10px 10px;font-weight:600}
.fabmenu button i{width:38px;height:38px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}

.mini-chip.on{background:var(--grad);color:#fff}.mini-chip.on i{color:#fff}
.mini-chip.warn{background:var(--warm-soft);box-shadow:none}.mini-chip.warn i{color:var(--warm)}.mini-chip.calm{background:var(--accent-soft);box-shadow:none}
.alert.compact{padding:10px 14px;gap:6px}
.warnline{font-size:.88rem;color:var(--warm);background:var(--warm-soft);border-radius:12px;padding:8px 12px}
nav.tabs a{position:relative}
.badge{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;font-size:.68rem;font-weight:800;line-height:18px;text-align:center;color:#fff;box-shadow:0 0 0 2px var(--surface)}
.badge.dot{min-width:11px;width:11px;height:11px;padding:0;top:6px;right:calc(50% - 16px)}
.b-ok{background:#1FAF83}.b-warn{background:#EF8436}.b-risk{background:#E5484D}
.tlist{display:flex;flex-direction:column;gap:10px}
.tcard{border-radius:18px;background:var(--sunk);overflow:hidden;position:relative}
.tcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--sc,var(--accent))}
.trow{display:flex;align-items:center;gap:12px;width:100%;background:transparent;box-shadow:none;border-radius:0;padding:12px 14px 12px 18px;text-align:left;font-weight:400;min-height:60px}
.trow:hover{box-shadow:none}
.tdot{width:12px;height:12px;border-radius:50%;background:var(--sc,var(--accent));flex:0 0 auto;box-shadow:0 0 0 4px color-mix(in srgb,var(--sc,var(--accent)) 20%,transparent)}
.tmain{display:flex;flex-direction:column;min-width:0;flex:1}.tmain b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}.tmain small{color:var(--muted);font-size:.8rem}
.chev{color:var(--muted);font-size:.8rem}
.s-bien{--sc:#1FAF83}.s-casi{--sc:#2F8BDB}.s-ajustado{--sc:#EF8436}.s-riesgo{--sc:#E5484D}.s-espera{--sc:#9C98C9}
.tdetail{display:flex;flex-direction:column;gap:10px;padding:0 16px 16px 18px}
.tdetail .row .small{min-height:36px}
.habit-toggles{display:flex;flex-wrap:wrap;gap:8px}
.htog{display:inline-flex;align-items:center;gap:8px;background:var(--sunk);border-radius:14px;padding:10px 14px;font-weight:600;box-shadow:none}
.htog i{width:22px;height:22px;border-radius:8px;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:.8rem;color:#fff}
.htog.on{background:var(--accent-soft);color:var(--accent)}.htog.on i{background:var(--grad);border-color:transparent}
.htog small{font-weight:400;color:var(--muted)}
.primary.big{min-height:58px;font-size:1.05rem;border-radius:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}.grid3 input{font-size:.95rem;padding-inline:8px}.grid3 label.f{min-width:0}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hab{display:flex;flex-direction:column;gap:8px}
.hab-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.hab-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.hd{display:flex;flex-direction:column;align-items:center;gap:3px}
.hd i{width:100%;max-width:38px;aspect-ratio:1;border-radius:12px;background:var(--sunk)}
.hd.on i{background:var(--grad)}
.hd.today i{outline:2px solid var(--accent);outline-offset:2px}
.hd small{font-size:.7rem;color:var(--muted)}
/* Finanzas simples */
.hero-money{background:var(--grad);color:#fff;border-radius:26px;padding:20px 22px;display:flex;flex-direction:column;gap:6px;box-shadow:0 14px 34px rgba(91,79,224,.25)}
.hero-money .label{color:rgba(255,255,255,.8)}.hero-money .big{font-family:var(--display);font-size:2.4rem;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.hm-row{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px;font-family:var(--display);font-weight:600}
.hm-row span{display:flex;flex-direction:column}.hm-row small{font-family:var(--body);font-weight:400;font-size:.75rem;color:rgba(255,255,255,.75)}.hm-row em{font-style:normal;font-weight:400;font-size:.8rem;color:rgba(255,255,255,.75)}
.plist{display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.prow:first-child{border-top:0}
.prow.done .pmain b,.prow.done .pamt{opacity:.55}
.pdot{width:10px;height:10px;border-radius:50%;background:var(--warm);flex:0 0 auto}.pdot.ok{background:var(--ok)}.pdot.risk{background:var(--risk)}
.pmain{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}.pmain small{color:var(--muted);font-size:.8rem}
.pamt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.92rem;white-space:nowrap}.pamt.pos{color:var(--ok)}
.thin{display:block;height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:3px}.thin i{display:block;height:100%;background:var(--grad);border-radius:99px}
.prow .small{min-height:34px;padding:6px 12px}
.icon{min-width:34px;padding:4px 8px!important}
.mrow{display:flex;flex-direction:column;gap:6px}
.mrow small{font-weight:400}
.typegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tg{display:flex;flex-direction:column;align-items:center;gap:6px;background:transparent;box-shadow:none;padding:4px 0;font-size:.78rem;font-weight:600;color:var(--muted)}
.tg i{width:50px;height:50px;border-radius:17px;background:var(--surface);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.tg i svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tg.sel{color:var(--ink)}.tg.sel i{background:var(--grad);color:#fff}
.amt{font-family:var(--display);font-size:2rem;font-weight:600;text-align:center;min-height:64px}
.chip.small{min-height:32px;padding:4px 10px;font-size:.85rem}
details.more summary{cursor:pointer;color:var(--accent);font-weight:600;padding:6px 0;list-style:none}details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:8px}
.gcard{border-top:1px solid var(--line)}.gcard:first-child{border-top:0}
.grow{display:flex;align-items:center;gap:10px;width:100%;background:transparent;box-shadow:none;padding:12px 0;text-align:left;font-weight:400}
.grow:hover{box-shadow:none}
.pri{font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:99px;vertical-align:middle}
.pri-alta{background:var(--risk-soft);color:var(--risk)}.pri-media{background:var(--class-soft);color:var(--class)}.pri-baja{background:var(--sunk);color:var(--muted)}.pri-sobra{background:var(--ok-soft);color:var(--ok)}
.split4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.split4 input{text-align:center}
.center{text-align:center}
/* Movimiento */
@media (prefers-reduced-motion:no-preference){
  #view.anim>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  #view.anim>*:nth-child(2){animation-delay:.05s}#view.anim>*:nth-child(3){animation-delay:.1s}#view.anim>*:nth-child(4){animation-delay:.15s}
  #view.anim>*:nth-child(5){animation-delay:.2s}#view.anim>*:nth-child(6){animation-delay:.25s}#view.anim>*:nth-child(n+7){animation-delay:.3s}
  @keyframes rise{from{transform:translateY(14px);opacity:.35}to{transform:none;opacity:1}}
  #view.anim .bar i,#view.anim .thin i{transform-origin:left;animation:grow .9s .15s cubic-bezier(.2,.8,.2,1) both}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  #view.anim .tl .blk{animation:slidein .45s cubic-bezier(.2,.8,.2,1) both}
  #view.anim .tl .blk:nth-child(2){animation-delay:.06s}#view.anim .tl .blk:nth-child(3){animation-delay:.12s}#view.anim .tl .blk:nth-child(n+4){animation-delay:.18s}
  @keyframes slidein{from{transform:translateX(-10px);opacity:.4}to{transform:none;opacity:1}}
  .badge.b-risk{animation:pulse 2s ease-in-out 3}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 2px var(--surface),0 0 0 0 rgba(229,72,77,.55)}50%{box-shadow:0 0 0 2px var(--surface),0 0 0 6px rgba(229,72,77,0)}}
  .htog.on i,.chip.sel,.mini-chip.on{animation:pop .28s ease-out}
  @keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
  .now.t-task .timer{animation:breathe 2.4s ease-in-out 2}
  @keyframes breathe{0%,100%{text-shadow:0 0 0 rgba(255,255,255,0)}50%{text-shadow:0 0 18px rgba(255,255,255,.55)}}
  .fab{transition:transform .2s ease}.fab:active{transform:scale(.92)}.fab svg{transition:transform .25s ease}
  .fabmenu .list button{animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
  .fabmenu .list button:nth-child(2){animation-delay:.03s}.fabmenu .list button:nth-child(3){animation-delay:.06s}.fabmenu .list button:nth-child(4){animation-delay:.09s}.fabmenu .list button:nth-child(n+5){animation-delay:.12s}
  .sheet{animation:sheetup .32s cubic-bezier(.2,.8,.2,1) both}
  @keyframes sheetup{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
  nav.tabs a{transition:background .25s ease,color .25s ease}
  .tcard,.gcard{transition:background .2s ease}
}
/* Gráfica de sueño en curva */
.wave text{font-family:var(--body);font-size:11px;fill:var(--muted)}

.hgrid i{border-radius:6px}.hgrid i.y{background:var(--grad)}

<script>
/*PLAN-START*/
const pad=n=>String(n).padStart(2,'0');
const toMin=s=>{if(!s)return 0;const[h,m]=String(s).split(':').map(Number);return h*60+(m||0)};
const fmt=m=>{m=Math.round(m);if(m>=1440)m-=1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d)};
const dow=k=>parseKey(k).getDay();
const daysBetween=(a,b)=>Math.round((parseKey(b)-parseKey(a))/864e5);
const clone=o=>JSON.parse(JSON.stringify(o));
const num=v=>{const x=parseFloat(String(v==null?'':v).replace(',','.'));return isNaN(x)?NaN:x};

const DEFAULTS={
  settings:{
    wakeWeekday:'06:30',wakeWeekend:'07:30',morningMin:60,restAfterU:45,homeGapMin:180,bringLunch:false,bed:'22:30',screensOff:'22:00',
    commuteMin:20,commuteBuffer:10,freeMin:120,freeMinWeekend:180,freeStart:'20:00',
    lunchMin:60,dinnerMin:60,maxWork:240,maxWorkHeavy:120,chunkMax:90,breakMin:15,
    margin:1.5,bufferHours:24,
    job:{on:true,day:0,start:'08:00',end:'16:00',commute:30,pauseOnVacation:false},
    vacation:{on:false,from:'',to:''},
    holidays:['2026-11-02','2026-11-16','2026-12-08','2026-12-25','2027-01-01','2027-01-11']
  },
  schedule:[],
  commitments:[],
  habits:[
    {id:'screens',name:'Pantallas fuera a tiempo'},
    {id:'meals',name:'Tres comidas completas'},
    {id:'move',name:'Moverme 20 minutos'},
    {id:'water',name:'Tomar agua',remindEvery:150}
  ]
};
const CATS={taller:'Taller o ejercicios',informe:'Informe o escrito',parcial:'Estudiar para parcial',proyecto:'Proyecto',lectura:'Lectura',otro:'Otro'};

function mergeConfig(d){
  d=d||{};const S=Object.assign({},DEFAULTS.settings,d.settings||{});
  S.job=Object.assign({},DEFAULTS.settings.job,(d.settings||{}).job||{});
  S.vacation=Object.assign({},DEFAULTS.settings.vacation,(d.settings||{}).vacation||{});
  return {settings:S,schedule:d.schedule||[],commitments:d.commitments||[],habits:(d.habits&&d.habits.length)?d.habits:clone(DEFAULTS.habits)};
}

function occursOn(c,k){
  if(c.endDate)return k>=c.date&&k<=c.endDate;
  if(c.repeat==='weekly')return k>=c.date&&dow(k)===dow(c.date)&&!(c.skip||[]).includes(k);
  return c.date===k;
}

function freeIntervals(blocks,lo,hi){
  const s=blocks.filter(b=>b.end>lo&&b.start<hi).map(b=>[Math.max(lo,b.start),Math.min(hi,b.end)]).sort((a,b)=>a[0]-b[0]);
  const out=[];let cur=lo;
  for(const[a,b]of s){if(a>cur)out.push([cur,a]);cur=Math.max(cur,b)}
  if(cur<hi)out.push([cur,hi]);
  return out;
}
function placeFlex(blocks,lo,hi,durs,winA,winB,target){
  const iv=freeIntervals(blocks,lo,hi);
  for(const dur of durs){
    let best=null;
    for(let s=winA;s+dur<=winB;s+=15){
      if(iv.some(([a,b])=>s>=a&&s+dur<=b)){const sc=Math.abs(s-target);if(best===null||sc<best.sc)best={s,sc,dur}}
    }
    if(best)return [best.s,best.s+best.dur];
  }
  return null;
}

function factorFor(cat,tasks,S,learn){
  const K=3;const prior=+S.margin||1.5;
  const done=tasks.filter(t=>t.done&&t.cat===cat&&t.estMin>0&&t.actualMin>0&&!t.example);
  const L=(learn&&learn[cat])||{n:0,sum:0};
  const sum=done.reduce((a,t)=>a+Math.min(4,Math.max(.5,t.actualMin/t.estMin)),0)+L.sum;
  const n=done.length+L.n;
  return {f:(prior*K+sum)/(K+n),n};
}
function spentMin(t,active,nowMs){
  let m=(t.sessions||[]).reduce((a,s)=>a+(s.min||0),0);
  if(active&&active.taskId===t.id)m+=Math.max(0,(nowMs-active.start)/60000);
  return m;
}
function remainingMin(t,f,active,nowMs){
  const sp=spentMin(t,active,nowMs);
  if(t.leftOverride!=null)return Math.max(0,t.leftOverride-(sp-(t.overrideSpent||0)));
  return Math.max(0,t.estMin*f-sp);
}

function learnedCommute(trips,dir,d){
  const ok=(trips||[]).filter(t=>t.dir===dir&&t.min>=3&&t.min<=180);
  let pick=ok.filter(t=>t.dow===d).slice(-8);
  if(pick.length<2)pick=ok.slice(-10);
  if(pick.length<(pick.every(t=>t.dow===d)&&pick.length>=2?2:3))return null;
  const avg=pick.reduce((a,t)=>a+t.min,0)/pick.length;
  return {min:Math.ceil(avg/5)*5,n:pick.length};
}
function habitPings(L,cfg){
  const out=[];
  for(const h of cfg.habits||[]){
    const ev=+h.remindEvery;if(!(ev>=30))continue;
    for(let m=L.wake+30;m<=L.screens-30;m+=ev){
      if(L.blocks.some(b=>b.type==='sleep'&&m>=b.start&&m<b.end))continue;
      out.push({min:m,id:h.id,name:h.name});
    }
  }
  return out.sort((a,b)=>a.min-b.min);
}
function planCfg(state){return Object.assign({},state.config,{_trips:(state.journal&&state.journal.commutes)||[]})}
function dayLayout(k,cfg,journal,clipFrom){
  const S=cfg.settings,d=dow(k);
  const vac=!!(S.vacation.on&&S.vacation.from&&S.vacation.to&&k>=S.vacation.from&&k<=S.vacation.to);
  const holiday=(S.holidays||[]).includes(k);
  const weekend=d===0||d===6;
  const relaxed=weekend||vac||holiday;
  const away=(cfg.commitments||[]).find(c=>c.endDate&&k>=c.date&&k<=c.endDate&&(k>c.date||toMin(c.start)<=toMin(relaxed?S.wakeWeekend:S.wakeWeekday))&&(k<c.endDate||toMin(c.end)>=toMin(S.screensOff)))||null;
  const Lida=learnedCommute(cfg._trips,'ida',d),Lvta=learnedCommute(cfg._trips,'vuelta',d);
  const goMin=Lida?Lida.min:+S.commuteMin,backMin=Lvta?Lvta.min:+S.commuteMin;
  const C=goMin+(+S.commuteBuffer);
  let wake=toMin(relaxed?S.wakeWeekend:S.wakeWeekday);
  const bed=toMin(S.bed),screens=Math.min(toMin(S.screensOff),bed);
  {const job=S.job;let firstOut=null;
   const cls=(vac||holiday||away)?[]:cfg.schedule.filter(c=>+c.day===d).map(c=>toMin(c.start));
   if(cls.length)firstOut=Math.min(...cls)-C;
   if(job.on&&d===+job.day&&!(vac&&job.pauseOnVacation)&&!away&&toMin(job.end)>toMin(job.start)){const jo=toMin(job.start)-(+job.commute||0);firstOut=firstOut==null?jo:Math.min(firstOut,jo)}
   if(firstOut!=null)wake=Math.max(240,Math.min(wake,firstOut-(+S.morningMin)));}
  const routineEnd=wake+(+S.morningMin);
  const B=[];
  B.push({start:0,end:wake,type:'sleep',title:'Dormir'});
  if(!away)B.push({start:wake,end:routineEnd,type:'routine',title:'Arrancar el día',sub:'Desayuno y alistarte sin afán'});
  let classMin=0,atUni=[];
  const classes=(vac||holiday||away)?[]:cfg.schedule.filter(c=>+c.day===d).map(c=>({start:toMin(c.start),end:toMin(c.end),name:c.name,room:c.room})).sort((a,b)=>a.start-b.start);
  for(const c of classes){classMin+=c.end-c.start;B.push({start:c.start,end:c.end,type:'class',title:c.name,sub:c.room||''})}
  if(classes.length){
    // Agrupa clases: si el hueco entre dos es largo, te vas a la casa y vuelves.
    const homeGap=+S.homeGapMin||180;const groups=[];
    for(const c of classes){const g=groups[groups.length-1];
      if(g&&c.start-g.end<Math.max(homeGap,backMin+C+30))g.end=Math.max(g.end,c.end);else groups.push({start:c.start,end:c.end})}
    groups.forEach((g,i)=>{
      B.push({start:g.start-C,end:g.start,type:'commute',title:'Ir a la U',sub:`${goMin} min de camino${Lida?' (medido)':''} + ${S.commuteBuffer} de margen`});
      B.push({start:g.end,end:g.end+backMin,type:'commute',title:'Volver a casa',sub:(i<groups.length-1?'Hueco largo: aprovecha en casa':'')+(Lvta?`${i<groups.length-1?' · ':''}${backMin} min (medido)`:'')});
      const home=g.end+backMin,until=i<groups.length-1?groups[i+1].start-C:screens;
      const rest=Math.min(+S.restAfterU||0,until-home);
      if(rest>=15)B.push({start:home,end:home+rest,type:'rest',title:'Descanso al llegar',sub:'Protegido: comer algo, ducha, recostarte'});
      atUni.push([g.start,g.end]);
    });
  }
  const inUni=(a,b)=>atUni.some(([x,y])=>a<y&&b>x);
  const job=S.job;
  if(job.on&&d===+job.day&&!(vac&&job.pauseOnVacation)&&!away&&toMin(job.end)>toMin(job.start)){
    const js=toMin(job.start),je=toMin(job.end),jc=+job.commute||0;
    if(jc)B.push({start:js-jc,end:js,type:'commute',title:'Ir al trabajo'});
    B.push({start:js,end:je,type:'job',title:'Trabajo',sub:'Domingo'});
    if(jc)B.push({start:je,end:je+jc,type:'commute',title:'Volver a casa'});
    {const rest=+S.restAfterU||0;if(rest>0&&je+jc+rest<=screens)B.push({start:je+jc,end:je+jc+rest,type:'rest',title:'Descanso al llegar',sub:'Protegido: recupérate del trabajo'});}
  }
  for(const c of cfg.commitments){
    if(!occursOn(c,k))continue;
    if(c.endDate){const s0=k===c.date?toMin(c.start):wake,e0=k===c.endDate?Math.min(toMin(c.end),screens):screens;
      if(e0>s0)B.push({start:Math.max(s0,wake),end:e0,type:'commit',title:c.label,sub:'Fuera de casa · sin tareas',cid:c.id});}
    else B.push({start:toMin(c.start),end:toMin(c.end),type:'commit',title:c.label,sub:c.open&&!c.done?'Duración estimada':c.repeat==='weekly'?'Cada semana':'Compromiso',cid:c.id,open:!!(c.open&&!c.done)});
  }
  B.push({start:screens,end:bed,type:'wind',title:'Soltar pantallas',sub:'Alista lo de mañana, ducha, luz baja'});
  B.push({start:bed,end:1440,type:'sleep',title:'Dormir'});
  // comidas y tiempo libre
  // Almuerzo: en la U solo si lo llevas; si no, al llegar a casa.
  const jd=journal&&journal[k];const brings=jd&&jd.lunch!=null?!!jd.lunch:!!S.bringLunch;
  const obst=B.filter(b=>b.type!=='rest').concat(brings?[]:atUni.map(([a,b])=>({start:a,end:b})));
  let lunch=placeFlex(obst,routineEnd,screens,[+S.lunchMin,45,30],660,brings?900:960,750),late=false;
  if(!lunch&&!brings){lunch=placeFlex(obst,routineEnd,screens,[45,30],660,1080,780);late=!!lunch}
  if(!lunch&&!brings&&atUni.some(([a,b])=>a<840&&b>690)){
    const snack=placeFlex(B,routineEnd,screens,[30,20],660,900,750);
    if(snack)B.push({start:snack[0],end:snack[1],type:'meal',title:'Comer algo en la U',sub:'No alcanzas a ir a casa: lleva o compra algo'});
  }
  if(lunch){
    // Si choca con el descanso al llegar, almuerzas apenas llegas y el resto del descanso va después.
    for(const r of B.filter(b=>b.type==='rest'&&b.start<lunch[1]&&b.end>lunch[0])){
      const len=lunch[1]-lunch[0],restLen=r.end-r.start;lunch=[r.start,r.start+len];
      const rem=Math.max(0,restLen-len);if(rem>=15){r.start=lunch[1];r.end=lunch[1]+rem}else B.splice(B.indexOf(r),1);
    }
    const arrived=B.some(b=>b.type==='commute'&&b.title==='Volver a casa'&&Math.abs(b.end-lunch[0])<=20);
    B.push({start:lunch[0],end:lunch[1],type:'meal',title:late?'Almuerzo tarde':'Almuerzo',sub:inUni(lunch[0],lunch[1])?'En la U (llevas almuerzo)':arrived?'En casa, al llegar':''});
  }
  const lunchAtU=atUni.some(([a,b])=>a<840&&b>690);
  const dinner=placeFlex(B,routineEnd,screens,[+S.dinnerMin,45,30],1050,screens,1140);
  if(dinner)B.push({start:dinner[0],end:dinner[1],type:'meal',title:'Cena',sub:'Si te toca cocinar, aquí cabe'});
  const fm=relaxed?+S.freeMinWeekend:+S.freeMin;
  const free=placeFlex(B,routineEnd,screens,[fm,Math.round(fm*.75/15)*15,60,30],routineEnd,screens,toMin(S.freeStart));
  if(free)B.push({start:free[0],end:free[1],type:'free',title:'Tiempo libre',sub:'Protegido: nada de trabajo aquí'});
  // bloques disponibles para tareas
  const tired=!!(journal&&journal[k]&&journal[k].tired);
  let cap=tired?60:(classMin>=300?+S.maxWorkHeavy:+S.maxWork);
  const lo=Math.max(routineEnd,clipFrom==null?0:Math.ceil(clipFrom/5)*5);
  const iv=freeIntervals(B,lo,screens);
  const chunks=[],open=[];
  for(const[a,b]of iv){
    let cur=a;
    while(b-cur>=25&&cap>=25){
      const len=Math.min(+S.chunkMax,b-cur,cap);
      chunks.push({start:cur,end:cur+len,loc:inUni(cur,cur+len)?'En la U':''});
      cap-=len;cur+=len;
      const br=Math.min(+S.breakMin,b-cur);
      if(br>0){open.push([cur,cur+br,'pausa']);cur+=br}
    }
    if(b-cur>=15)open.push([cur,b]);
  }
  return {k,d,vac,holiday,away,weekend,relaxed,wake,bed,screens,routineEnd,classMin,atUni,lunchAtU,brings,tired,cap0:tired?60:(classMin>=300?+S.maxWorkHeavy:+S.maxWork),blocks:B,chunks,open};
}

function buildPlan(state,now){
  const cfg=state.config,S=cfg.settings,today=dkey(now);
  const nowMin=now.getHours()*60+now.getMinutes(),nowMs=now.getTime();
  const all=state.tasks.items||[],active=state.tasks.active;
  const tasks=all.filter(t=>!t.done).map(t=>{
    const fr=factorFor(t.cat,all,S,state.tasks.learn);
    const dl=daysBetween(today,t.dueDate)*1440+toMin(t.dueTime||'23:59');
    const need=Math.round(remainingMin(t,fr.f,active,nowMs)/5)*5;
    const tgt=dl-nowMin>(+S.bufferHours)*60*1.5?dl-(+S.bufferHours)*60:dl;
    return {t,id:t.id,f:fr.f,need,left:need,dl,tgt,sessions:[],lastEnd:null};
  });
  const maxDl=Math.max(0,...tasks.map(x=>x.dl));
  const horizon=Math.min(70,Math.max(14,Math.ceil(maxDl/1440)+1));
  const days=[];
  for(let i=0;i<horizon;i++){
    const k=addDays(today,i);
    const L=dayLayout(k,planCfg(state),state.journal.days,i===0?nowMin:null);
    L.i=i;
    for(const ch of L.chunks){
      let s=ch.start;const e=ch.end;
      while(e-s>=15){
        const abs=i*1440+s;
        const cand=tasks.filter(x=>x.left>0&&x.dl>abs&&!(x.t.waitingFor&&i===0)&&!(x.t.atHome&&ch.loc==='En la U')).sort((a,b)=>a.tgt-b.tgt||a.dl-b.dl);
        if(!cand.length)break;
        const x=cand[0];
        const len=Math.max(5,Math.min(e-s,x.left,x.dl-abs));
        L.blocks.push({start:s,end:s+len,type:'task',title:x.t.name,sub:ch.loc,taskId:x.id});
        x.sessions.push({k,start:s,end:s+len});
        x.left=Math.max(0,x.left-len);x.lastEnd=abs+len;s+=len;
        if(e-s<25)break;
      }
    }
    for(const[a,b]of freeIntervals(L.blocks,Math.max(L.routineEnd,i===0?Math.ceil(nowMin/5)*5:0),L.screens)){if(b-a>=20)L.blocks.push({start:a,end:b,type:'open',title:'Tiempo tuyo',sub:'Nada planeado'})}
    L.blocks.sort((a,b)=>a.start-b.start||a.end-b.end);
    L.pings=habitPings(L,cfg);
    days.push(L);
  }
  const info={};
  for(const x of tasks){
    let status='bien';
    if(x.need<=0)status='casi';
    else if(x.left>0)status='riesgo';
    else if(x.lastEnd>x.tgt)status='ajustado';
    info[x.id]={status,need:x.need,short:x.left,f:x.f,next:x.sessions[0]||null,sessions:x.sessions,dl:x.dl};
  }
  return {today,nowMin,days,info};
}

function pruneTasks(){
  const lim=Date.now()-14*864e5;const T=state.tasks;const old=T.items.filter(t=>t.done&&t.doneAt&&Date.parse(t.doneAt)<lim);
  if(!old.length)return false;
  T.learn=T.learn||{};T.stats=T.stats||{done:0,onTime:0};
  for(const t of old){
    if(t.estMin>0&&t.actualMin>0&&!t.example){const L=T.learn[t.cat]=T.learn[t.cat]||{n:0,sum:0};L.n++;L.sum+=Math.min(4,Math.max(.5,t.actualMin/t.estMin))}
    if(!t.example){T.stats.done++;if(!(t.doneAt.slice(0,10)>t.dueDate))T.stats.onTime++}

}
function pruneCommitments(){

  state.config.commitments=state.config.commitments.filter(c=>c.repeat==='weekly'||(c.endDate||c.date)>=today);
  return state.config.commitments.length!==before;
}
function commitEditForm(c){
  return `<form class="stack" data-form="edit-commit" data-id="${c.id}" style="padding:12px;border-radius:16px;background:var(--sunk)">
    <label class="f">Qué es<input id="ec-label" value="${esc(c.label)}"></label>
    <div class="grid2"><label class="f">${c.endDate?'Desde el día':'Día'}<input id="ec-date" type="date" value="${c.date}"></label><label class="f">Desde<input id="ec-start" type="time" value="${c.start}"></label></div>
    <div class="grid2">${c.endDate?`<label class="f">Hasta el día<input id="ec-enddate" type="date" value="${c.endDate}"></label>`:''}<label class="f">Hasta<input id="ec-end" type="time" value="${c.end}"></label></div>
    ${c.endDate?'':`<label class="check"><input type="checkbox" id="ec-weekly" ${c.repeat==='weekly'?'checked':''}> Se repite cada semana</label>`}
    <div class="row"><button class="primary small" type="button" data-act="submit">Guardar cambios</button><button class="small ghost" type="button" data-act="edit-commit" data-id="${c.id}">Cancelar</button></div></form>`;
}
function taskEditForm(t){

    <div class="grid2"><label class="f">Tipo<select id="et-cat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${t.cat===k?'selected':''}>${v}</option>`).join('')}</select></label>

    <label class="f">Tu estimado (horas)<input id="et-est" inputmode="decimal" value="${(t.estMin/60).toFixed(2).replace(/\.?0+$/,'')}"></label>

    <div class="row"><button class="primary small" type="button" data-act="submit">Guardar cambios</button><button class="small ghost" type="button" data-act="edit-task" data-id="${t.id}">Cancelar</button></div></form>`;
}
function vDia(){
  const P=PLAN||plan();const D=P.days[UI.day]||P.days[0];
  let h=`<div class="days">${P.days.slice(0,10).map((d,i)=>{const dd=parseKey(d.k);return `<button class="${i===UI.day?'sel':''}" data-act="pick-day" data-i="${i}"><span>${i===0?'hoy':DS[dd.getDay()]}</span><b>${dd.getDate()}</b></button>`}).join('')}</div>`;
  const work=D.blocks.filter(b=>b.type==='task').reduce((a,b)=>a+b.end-b.start,0);
  const free=D.blocks.filter(b=>b.type==='free').reduce((a,b)=>a+b.end-b.start,0);
  const sleep=(1440-D.bed)+D.wake;
  h+=`<section class="card"><div class="top"><h2>${longDate(D.k)}</h2><button class="small" data-act="sheet-commit">Agregar compromiso</button></div>
    <div class="stats">
      <div class="stat"><span class="label">Sueño</span><b>${dur(sleep)}</b></div>
      <div class="stat"><span class="label">Tiempo libre</span><b>${dur(free)}</b></div>
      <div class="stat"><span class="label">Tareas</span><b>${work?dur(work):'—'}</b></div>
    </div>
    ${D.away?`<p class="muted">Fuera de casa: ${esc(D.away.label)}. Sin clases, trabajo ni tareas.</p>`:D.vac?'<p class="muted">Día de vacaciones: sin clases ni trayectos.</p>':D.holiday?'<p class="muted">Festivo: sin clases.</p>':''}
    <div class="tl">${D.blocks.filter(b=>!(b.type==='sleep'&&b.start===0)).map(b=>blockRow(b,P.nowMin,UI.day===0)).join('')}</div></section>`;
  const cm=state.config.commitments;
  h+=`<section class="card"><h3>Compromisos e imprevistos</h3>${cm.length?cm.slice().sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start)).map(c=>`<div class="row" style="justify-content:space-between"><span><b>${esc(c.label)}</b>${c.open&&!c.done?' <span class="pill p-ej">Estimado</span>':''} <span class="muted">${c.endDate?`${shortDate(c.date)} ${c.start} → ${shortDate(c.endDate)} ${c.end}`:`${c.repeat==='weekly'?'cada '+DN[dow(c.date)]:shortDate(c.date)} · ${c.start}–${c.end}`}</span></span><span class="row" style="gap:6px"><button class="ghost small" data-act="edit-commit" data-id="${c.id}">Editar</button><button class="ghost small danger" data-act="del-commit" data-id="${c.id}">Quitar</button></span></div>${UI.editCommit===c.id?commitEditForm(c):''}`).join(''):'<p class="muted">Aún no hay. Cuando veas a tu novia, recojas a tu prima o te toque cocinar, agrégalo y el plan se reorganiza solo.</p>'}</section>`;
  return h;
}

function vTareas(){
  const P=PLAN||plan();
  const items=state.tasks.items;
  const pend=items.filter(t=>!t.done).sort((a,b)=>(a.dueDate+a.dueTime).localeCompare(b.dueDate+b.dueTime));
  const done=items.filter(t=>t.done).sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||''));
  const risk=pend.filter(t=>(P.info[t.id]||{}).status==='riesgo');
  let h='';
  if(risk.length)h+=`<div class="alert compact"><b>${risk.length===1?'1 tarea no alcanza':risk.length+' tareas no alcanzan'} antes de la entrega</b><span class="muted">Ábrela para ver opciones. No te quito sueño para cubrirla.</span></div>`;
  h+=`<section class="card"><div class="top"><h2>Pendientes</h2><button class="small primary" data-act="fab-do" data-v="task">+ Nueva</button></div>
    ${pend.length?`<div class="tlist">${pend.map(t=>taskRow(t,P)).join('')}</div>`:'<p class="muted">Nada pendiente. Disfruta.</p>'}</section>`;
  if(done.length)h+=`<section class="card"><button class="ghost" data-act="toggle-done">${UI.doneOpen?'Ocultar':'Ver'} terminadas (${done.length})</button>${UI.doneOpen?done.slice(0,30).map(t=>{const late=t.doneAt&&t.doneAt.slice(0,10)>t.dueDate;return `<div class="trow s-${late?'riesgo':'bien'}" style="cursor:default"><span class="tdot"></span><span class="tmain"><b>${esc(t.name)}</b><small>Estimaste ${dur(t.estMin)} · tomó ${dur(t.actualMin||0)}</small></span><span class="pill ${late?'p-riesgo':'p-bien'}">${late?'Tarde':'A tiempo'}</span></div>`}).join(''):''}</section>`;
  return h;
}
function taskRow(t,P){
  const I=P.info[t.id]||{status:'bien',need:0};
  const dd=daysBetween(P.today,t.dueDate);
  const st=t.waitingFor?'espera':I.status==='riesgo'||dd<0?'riesgo':I.status==='ajustado'||dd<=1?'ajustado':I.status;
  const lab={bien:'Va bien',ajustado:'Ajustada',riesgo:'No alcanza',casi:'¿Ya casi?',espera:'Esperando'}[st];
  const open=UI.topen===t.id;
  const active=state.tasks.active&&state.tasks.active.taskId===t.id;
  return `<div class="tcard s-${st} ${open?'open':''}"><button class="trow" data-act="topen" data-id="${t.id}" aria-expanded="${open}">
    <span class="tdot"></span><span class="tmain"><b>${esc(t.name)}</b><small>${relDay(t.dueDate,P.today)==='hoy'?'Entrega hoy':'Entrega '+relDay(t.dueDate,P.today)} · ${t.waitingFor?'esperando a '+esc(t.waitingFor):'faltan ~'+dur(I.need)}${t.atHome?' · solo en casa':''}</small></span>
    ${active?'<span class="pill p-bien">En curso</span>':`<span class="pill p-${st==='espera'?'ajustado':st}">${lab}</span>`}<span class="chev">${open?'▴':'▾'}</span></button>
    ${open?taskItem(t,P):''}</div>`;
}
function taskItem(t,P){
  const I=P.info[t.id]||{status:'bien',need:0,short:0,f:1.5};
  const sp=spentMin(t,state.tasks.active,Date.now());
  const total=sp+I.need;const pct=total?Math.min(100,sp/total*100):100;
  const lab={bien:'Va bien',ajustado:'Ajustada',riesgo:'No alcanza',casi:'¿Ya casi?'}[I.status];
  const nx=I.next?`Próxima sesión: ${relDay(I.next.k,P.today)} ${fmt(I.next.start)}–${fmt(I.next.end)}`:(I.need>0?'Sin espacio antes de la entrega':'Ya usaste el tiempo estimado');
  let extra='';
  if(UI.finishing===t.id){extra=`<form class="row" data-form="finish" data-id="${t.id}"><label class="f">¿Cuánto te tomó en total? (horas)<input id="fin-${t.id}" type="text" inputmode="decimal" value="${(Math.max(sp,t.estMin)/60).toFixed(2)}"></label><button class="primary" type="button" data-act="submit">Guardar</button></form>`}
  if(UI.adjusting===t.id){extra=`<form class="row" data-form="adjust" data-id="${t.id}"><label class="f">¿Cuánto te falta de verdad? (horas)<input id="adj-${t.id}" type="text" inputmode="decimal" value="${(I.need/60).toFixed(2)}"></label><button class="primary" type="button" data-act="submit">Recalcular</button></form>`}
  if(UI.editTask===t.id){extra=taskEditForm(t)}
  if(UI.waiting===t.id){extra=`<form class="row" data-form="waiting" data-id="${t.id}"><label class="f">¿A quién esperas?<input id="wait-${t.id}" autocomplete="off" placeholder="Ej: mi compañera" value="${esc(t.waitingFor||'')}"></label><button class="primary" type="button" data-act="submit">Guardar</button></form>`}
  const active=state.tasks.active&&state.tasks.active.taskId===t.id;
  return `<div class="tdetail">
    ${t.waitingFor?`<div class="alert warn" style="padding:10px 12px"><b>Esperando a ${esc(t.waitingFor)}</b><span>Hoy no te pongo bloques de esto. Escríbele hoy para cuadrar; desde mañana lo vuelvo a planear.</span><div class="row"><button class="small primary" data-act="unwait" data-id="${t.id}">Ya podemos empezar</button></div></div>`:''}
    <span class="muted">${CATS[t.cat]||''} · entrega ${shortDate(t.dueDate)} ${t.dueTime}${t.example?' · ejemplo':''}</span>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <span class="muted">${dur(sp)} hechos · faltan ~${dur(I.need)} (tu estimado ${dur(t.estMin)} × ${I.f.toFixed(1)} de margen)</span>
    <span>${nx}</span>
    ${I.status==='riesgo'?`<span class="danger">Faltan ${dur(I.short)} de espacio. Empieza ya o pide más plazo.</span>`:''}
    <div class="row">${active?'<button class="small primary" data-act="stop">Pausar</button>':`<button class="small" data-act="start" data-id="${t.id}">Empezar</button>`}
      <button class="small" data-act="finish" data-id="${t.id}">Terminé</button>
      <button class="small" data-act="edit-task" data-id="${t.id}">Editar</button>
      <button class="small" data-act="adjust" data-id="${t.id}">Me falta otra cantidad</button>
      ${t.waitingFor?'':`<button class="small" data-act="wait" data-id="${t.id}">Espero a alguien</button>`}
      <button class="small ghost danger" data-act="del-task" data-id="${t.id}">${UI.confirmDel===t.id?'¿Seguro? Borrar':'Borrar'}</button></div>
    ${extra}</div>`;
}

function vRegistro(){
  const today=dkey(new Date());const S=state.config.settings;
  const J=state.journal.days[today]||{};const hrs=sleepMin(J);
  const EN=['','Sin nada','Poca','Normal','Bien','Con todo'];
  let h=`<section class="card"><div class="top"><h2>Tu noche</h2>${J.wokeAt?`<button class="small" data-act="sleep-open" data-k="${today}">Editar</button>`:''}</div>
    ${J.wokeAt?`<div class="stats"><div class="stat"><span class="label">Dormiste</span><b>${dur(hrs)}</b></div><div class="stat"><span class="label">Energía</span><b style="font-size:1.15rem">${EN[J.energy]||'—'}</b></div><div class="stat"><span class="label">Te quitó sueño</span><b style="font-size:1.15rem">${esc((J.thief||[]).join(', ')||'—')}</b></div></div>
      <p class="muted">${hrs<420?'Menos de 7 h: hoy no te exijas de más.':'Buen descanso.'}</p>`
    :`<button class="primary big" data-act="sleep-open" data-k="${today}">Registrar mi noche · 10 segundos</button>`}</section>`;
  const day=(k,lab)=>{const D=state.journal.days[k]||{};return `<div class="stack" style="gap:8px"><span class="label">${lab}</span><div class="habit-toggles">${state.config.habits.map(x=>{const on=(D.habits||{})[x.id];const cnt=x.id==='water'&&(D.count||{}).water;return `<button class="htog ${on?'on':''}" data-act="htoggle" data-k="${k}" data-v="${x.id}"><i>${on?'✓':''}</i>${esc(x.name)}${cnt?` <small>(${cnt} vasos)</small>`:''}</button>`}).join('')}</div></div>`};
  h+=`<section class="card"><h2>Hábitos</h2>${day(today,'Hoy')}${day(addDays(today,-1),'Ayer')}</section>`;
  const miss=[...Array(6)].map((_,i)=>addDays(today,-(i+1))).filter(k=>!(state.journal.days[k]||{}).wokeAt);
  if(miss.length)h+=`<section class="card"><h3>Noches sin registrar</h3><div class="row">${miss.map(k=>`<button class="chip" data-act="sleep-open" data-k="${k}">${shortDate(k)}</button>`).join('')}</div></section>`;
  h+=`<section class="card"><h3>Tu meta de sueño</h3><p class="muted">Pantallas fuera <span class="time">${S.screensOff}</span> · a la cama <span class="time">${S.bed}</span> · arriba <span class="time">${S.wakeWeekday}</span>. Lo cambias en Ajustes.</p></section>`;
  return h;
}
function gap(a,b){let d=toMin(b)-toMin(a);if(d<0)d+=1440;return d}
function sleepMin(J){if(!J||!J.wokeAt)return 0;const s=J.sleptAt||J.bedAt;if(!s)return 0;return gap(s,J.wokeAt)}

function vProgreso(){
  const today=dkey(new Date());const S=state.config.settings;
  const ks=[...Array(14)].map((_,i)=>addDays(today,i-13));
  const D=state.journal.days;
  const vals=ks.map(k=>sleepMin(D[k])/60);
  const logged=vals.filter(v=>v>0);
  const avg=logged.length?logged.reduce((a,b)=>a+b,0)/logged.length:0;
  const goal=((1440-toMin(S.bed))+toMin(S.wakeWeekday))/60;
  const W=560,H=210,pl=12,pr=12,pb=34,pt=24,max=10;
  const xs=i=>pl+i*(W-pl-pr)/13;
  const y=v=>pt+(H-pt-pb)*(1-Math.min(max,v)/max);
  const P=ks.map((k,i)=>vals[i]>0?[xs(i),y(vals[i]),vals[i],k]:null).filter(Boolean);
  const curve=pts=>{if(pts.length<2)return '';let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6,c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;d+=` C${c1x},${c1y} ${c2x},${c2y} ${p2[0]},${p2[1]}`}return d};
  const line=curve(P);
  const area=line?`${line} L${P[P.length-1][0]},${H-pb} L${P[0][0]},${H-pb} Z`:'';
  const goalLine=`<line x1="${pl}" x2="${W-pr}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--accent)" stroke-dasharray="4 5" stroke-width="1.3" opacity=".6"/><text x="${W-pr}" y="${y(goal)-6}" text-anchor="end" style="fill:var(--accent)">meta ${goal.toFixed(1)} h</text>`;
  const labels=ks.map((k,i)=>`<text x="${xs(i)}" y="${H-12}" text-anchor="middle" class="${k===today?'today':''}">${DS[parseKey(k).getDay()].charAt(0).toUpperCase()}${parseKey(k).getDate()}</text>`).join('');
  const dots=P.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="${p[3]===today?5.5:3.5}" fill="${p[2]>=7?'var(--accent)':'var(--warm)'}" stroke="var(--surface)" stroke-width="2"><title>${shortDate(p[3])}: ${p[2].toFixed(1)} h</title></circle>`).join('');
  const bars=`<defs><linearGradient id="wv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8F56EE" stop-opacity=".35"/><stop offset="1" stop-color="#8F56EE" stop-opacity="0"/></linearGradient><linearGradient id="wl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5B4FE0"/><stop offset="1" stop-color="#C065E2"/></linearGradient></defs>
    ${area?`<path d="${area}" fill="url(#wv)"/><path d="${line}" fill="none" stroke="url(#wl)" stroke-width="3.5" stroke-linecap="round"/>`:''}${dots}${labels}${P.length<2?`<text x="${W/2}" y="${H/2}" text-anchor="middle">Registra al menos 2 noches para ver tu curva</text>`:''}`;
  const grid='';
  const items=state.tasks.items.filter(t=>!t.example);
  const doneT=items.filter(t=>t.done);const arch=state.tasks.stats||{done:0,onTime:0};
  const onTime=doneT.filter(t=>!(t.doneAt&&t.doneAt.slice(0,10)>t.dueDate)).length;
  const thief={};ks.forEach(k=>((D[k]||{}).thief||[]).forEach(x=>{if(x!=='Nada')thief[x]=(thief[x]||0)+1}));
  const topThief=Object.entries(thief).sort((a,b)=>b[1]-a[1])[0];
  let h=`<section class="card"><h2>Sueño, últimas 2 semanas</h2>
    <div class="stats"><div class="stat"><span class="label">Promedio</span><b>${avg?avg.toFixed(1)+' h':'—'}</b></div>
    <div class="stat"><span class="label">Noches registradas</span><b>${logged.length}/14</b></div>
    <div class="stat"><span class="label">Más te quita sueño</span><b style="font-size:1.2rem">${topThief?esc(topThief[0]):'—'}</b></div></div>
    <div class="scroll"><svg class="wave" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:380px" role="img" aria-label="Horas de sueño por noche">${grid}${goalLine}${bars}</svg></div>
    <p class="muted">Puntos morados: 7 h o más. Naranjas: menos de 7 h.</p></section>`;
  const trips=state.journal.commutes||[];
  const tStat=dir=>{const xs=trips.filter(t=>t.dir===dir);if(!xs.length)return '—';const a=xs.reduce((s,t)=>s+t.min,0)/xs.length;return Math.round(a)+' min'};
  h+=`<section class="card"><h2>Trayectos</h2>
    <div class="stats"><div class="stat"><span class="label">Ida a la U</span><b>${tStat('ida')}</b></div><div class="stat"><span class="label">Vuelta a casa</span><b>${tStat('vuelta')}</b></div><div class="stat"><span class="label">Medidos</span><b>${trips.length}</b></div></div>
    ${trips.length?`<div class="stack" style="gap:4px">${trips.slice(-6).reverse().map(t=>`<span class="muted">${shortDate(dkey(new Date(t.leftAt)))} ${fmt(new Date(t.leftAt).getHours()*60+new Date(t.leftAt).getMinutes())} · ${t.dir==='ida'?'ida':'vuelta'} · <span class="time">${t.min} min</span></span>`).join('')}</div>`:''}
    <p class="muted">Con 3 trayectos (o 2 del mismo día de la semana) uso tu tiempo real en vez de los ${S.commuteMin} min.</p></section>`;
  {const last30=[...Array(30)].map((_,j)=>addDays(today,j-29));const last7=last30.slice(-7);
   const row=x=>{const has=k=>!!(((D[k]||{}).habits||{})[x.id]);let streak=0;for(let j=last30.length-1;j>=0;j--){const k=last30[j];if(has(k))streak++;else if(k===today)continue;else break}
     const m=last30.filter(has).length;
     return `<div class="hab"><div class="hab-top"><b>${esc(x.name)}</b><span class="muted">${streak?`🔥 ${streak} ${streak===1?'día':'días'}`:'Sin racha'}</span></div>
       <div class="hab-week">${last7.map(k=>`<span class="hd ${has(k)?'on':''} ${k===today?'today':''}" title="${shortDate(k)}"><i></i><small>${DS[parseKey(k).getDay()].charAt(0).toUpperCase()}</small></span>`).join('')}</div>
       <div class="row" style="gap:10px"><div class="bar" style="flex:1"><i style="width:${m/30*100}%"></i></div><span class="mono muted" style="font-size:.8rem">${m}/30 días</span></div></div>`};
   h+=`<section class="card"><h2>Hábitos</h2><p class="muted">Últimos 7 días y cuántos de los últimos 30 cumpliste.</p><div class="stack" style="gap:16px">${state.config.habits.map(row).join('')}</div></section>`;}
  const cats=Object.keys(CATS).map(c=>({c,...factorFor(c,state.tasks.items,S,state.tasks.learn)})).filter(x=>x.n>0);
  h+=`<section class="card"><h2>Cómo calculas tus tiempos</h2>
    <div class="stats"><div class="stat"><span class="label">Terminadas</span><b>${doneT.length+arch.done}</b></div><div class="stat"><span class="label">A tiempo</span><b>${doneT.length+arch.done?Math.round((onTime+arch.onTime)/(doneT.length+arch.done)*100)+'%':'—'}</b></div></div>
    ${cats.length?cats.map(x=>`<p><b>${CATS[x.c]}</b>: tardas ${x.f.toFixed(1)} veces lo que estimas <span class="muted">(${x.n} ${x.n===1?'tarea':'tareas'})</span></p>`).join(''):`<p class="muted">Cuando termines tareas usando el botón Empezar, aquí verás cuánto te desfasas por tipo de tarea. Mientras tanto uso un margen de ${(+S.margin).toFixed(1)}×.</p>`}
  </section>`;
  return h;
}

function vAjustes(){return accountCard()+notifPermissionCard()+vAjustesBase()}
function vBien(){
  const sub=UI.sub.bien||'hoy';
  return seg('bien',sub,[['hoy','Sueño y hábitos'],['progreso','Progreso']])+(sub==='progreso'?vProgreso():vRegistro());
}
function vAjustesBase(){

function fin(){

function monthKey(k){return k.slice(0,7)}

function monthlyAvg(type,ref,filter){

  const used=tot.filter((t,i)=>i===0||t>0);

/* --- tarjeta --- */
function card(){return fin().debts.find(d=>d.kind==='card')}
function cardDueFor(c,dateStr){
  const[y,m,d]=dateStr.split('-').map(Number);const cut=+c.cutDay||29,pay=Math.min(+c.payDay||18,28);
  const stmt=d<=cut?m-1:m;               // mes (0-11) del corte que incluye la compra
  return dkey(new Date(y,stmt+1,pay));    // se paga el mes siguiente al corte
}
function addMonths(k,n){const[y,m,d]=k.split('-').map(Number);return dkey(new Date(y,m-1+n,d))}
function cardOwedThrough(c,D){
  return (c.purchases||[]).reduce((a,p)=>{const n=p.cuotas||1,inst=p.amount/n,f=cardDueFor(c,p.date);let cnt=0;for(let i=0;i<n;i++){if(addMonths(f,i)<=D)cnt++;else break}
    return a+Math.max(0,Math.min(p.amount,inst*cnt)-(p.amount-p.left))},0);
}
function cardRecalc(c){
  c.purchases=(c.purchases||[]).filter(p=>p.left>0.5);
  c.balance=c.purchases.reduce((a,p)=>a+p.left,0);
  const dates=[...new Set(c.purchases.flatMap(p=>{const f=cardDueFor(c,p.date);return [...Array(p.cuotas||1)].map((_,i)=>addMonths(f,i))}))].sort();
  c.nextDue=null;c.minPay=0;
  for(const D of dates){const o=cardOwedThrough(c,D);if(o>0.5){c.nextDue=D;c.minPay=Math.round(o+c.purchases.filter(p=>p.cuotas>1).reduce((a,p)=>a+p.left,0)*(c.rate||0)/100);break}}
  if(!c.original||c.original<c.balance)c.original=c.balance;
}
function cardSplit(c){
  const one=(c.purchases||[]).filter(p=>p.cuotas<=1).reduce((a,p)=>a+p.left,0);
  const multi=(c.purchases||[]).filter(p=>p.cuotas>1);
  return {one,multi:multi.reduce((a,p)=>a+p.left,0),multiPay:multi.reduce((a,p)=>a+Math.min(p.left,p.amount/p.cuotas),0)};
}
function ensureCard(){
  const F=fin();let c=card();
  if(!c){c={id:uid(),kind:'card',name:'Tarjeta de crédito',balance:0,original:0,rate:0,minPay:0,cutDay:29,payDay:18,purchases:[]};F.debts.push(c)}
  return c;
}
function cutInfo(c){const t=dkey(new Date());const[y,m,d]=t.split('-').map(Number);const cut=+c.cutDay||29;const cd=d<=cut?new Date(y,m-1,Math.min(cut,new Date(y,m,0).getDate())):new Date(y,m,Math.min(cut,new Date(y,m+1,0).getDate()));return {cut:dkey(cd),payNow:cardDueFor(c,t)}}
function niceDate(k){const d=parseKey(k);return `${d.getDate()} ${MN[d.getMonth()].slice(0,3)}`}
/* deudas que cobran (excluye compras a 1 cuota) */
function realDebts(){
  return fin().debts.map(d=>{
    if(d.kind!=='card')return d.balance>0?{id:d.id,name:d.name,balance:d.balance,rate:d.rate||0,minPay:d.minPay||0}:null;
    const s=cardSplit(d);return s.multi>0?{id:d.id,name:d.name+' (a cuotas)',balance:s.multi,rate:d.rate||0,minPay:Math.round(s.multiPay)}:null;
  }).filter(Boolean);
}
function debtTargets(){
  const ds=fin().debts.filter(d=>d.kind!=='card'&&d.balance>0);
  const pr=ds.filter(d=>d.priority),rest=ds.filter(d=>!d.priority);
  fin().strategy==='bola'?rest.sort((a,b)=>a.balance-b.balance):rest.sort((a,b)=>(b.rate||0)-(a.rate||0)||a.balance-b.balance);
  return pr.concat(rest);
}
function debtOrder(){
  const ds=realDebts();const pr=ds.filter(d=>{const x=fin().debts.find(y=>y.id===d.id);return x&&x.priority});const rest=ds.filter(d=>!pr.includes(d));
  fin().strategy==='bola'?rest.sort((a,b)=>a.balance-b.balance):rest.sort((a,b)=>(b.rate||0)-(a.rate||0)||a.balance-b.balance);
  return pr.concat(rest);
}
function payoffMonths(balance,ratePct,pay){
  if(!(pay>0))return null;let b=balance,m=0;const r=(ratePct||0)/100;
  while(b>0&&m<600){const nb=b*(1+r)-pay;if(nb>=b)return Infinity;b=nb;m++}
  return m;
}
function payoffAll(monthly){
  const ds=debtOrder().map(d=>({b:d.balance,r:d.rate/100,min:d.minPay}));
  if(!ds.length)return 0;if(!(monthly>0))return null;
  const start=ds.reduce((a,d)=>a+d.b,0);let m=0;
  while(ds.some(d=>d.b>0)&&m<600){
    ds.forEach(d=>{if(d.b>0)d.b*=1+d.r});
    let left=monthly;
    ds.forEach(d=>{if(d.b>0){const p=Math.min(d.b,d.min,left);d.b-=p;left-=p}});
    for(const d of ds){if(left<=0)break;if(d.b>0){const p=Math.min(d.b,left);d.b-=p;left-=p}}
    m++;if(m===24&&ds.reduce((a,d)=>a+d.b,0)>=start)return Infinity;
  }
  return m>=600?Infinity:m;
}
function monthsLabel(m){if(m==null)return 'sin pagos aún para calcular';if(m===Infinity)return 'con ese pago no alcanzas a cubrir los intereses';if(m<=1)return 'este mes';const d=new Date();d.setMonth(d.getMonth()+m);return `~${m} meses (${MN[d.getMonth()]} ${d.getFullYear()})`}

/* --- pagos fijos --- */
function classFrac(mk){
  const V=state.config.settings.vacation||{};const[y,m]=mk.split('-').map(Number);const n=new Date(y,m,0).getDate();
  if(!(V.on&&V.from&&V.to))return 1;let c=0;for(let d=1;d<=n;d++){const k=mk+'-'+pad(d);if(!(k>=V.from&&k<=V.to))c++}
  return c/n;
}
function expectedIncome(){
  const F=fin();const base=+F.expectedIncome||300000;
  const done=lastMonths(4).slice(1).map(m=>F.moves.filter(x=>x.type==='in'&&monthKey(x.date)===m).reduce((a,x)=>a+x.amount,0)).filter(v=>v>0);
  return Math.round((base+done.reduce((a,b)=>a+b,0))/(1+done.length));
}
function ownBank(){
  const F=fin();const ins=F.moves.filter(x=>x.type==='in').reduce((a,x)=>a+incPlan(x).own,0);
  const outs=F.moves.filter(x=>(x.type==='out'&&moveKind(x)==='own')||(x.type==='use'&&x.from==='own')).reduce((a,x)=>a+x.amount,0);

}
function obligations(){

  let cardM=N.card;
  if(c&&c.nextDue&&N.card>0){const[y,m]=c.nextDue.split('-').map(Number);const d=new Date();const months=Math.max(1,(y-d.getFullYear())*12+(m-1-d.getMonth())+1);cardM=N.card/months}
  return {fixed:N.fixed,card:cardM};

function fixedState(){

  return F.fixed.map(x=>{

      const est=r1000((x.amount||0)*classFrac(mk));return Object.assign({},x,{spent,est,expected:Math.max(est,spent)})}

}

/* --- metas --- */
function monthsTo(ym){if(!ym)return null;const[y,m]=ym.split('-').map(Number);const d=new Date();return Math.max(1,(y-d.getFullYear())*12+(m-1-d.getMonth()))}
function goalInfo(g){
  const left=Math.max(0,g.target-g.saved);const mt=monthsTo(g.deadline);
  const need=left<=0?0:mt?left/mt:null;
  const pace=monthlyAvg('save',g.id);
  return {left,mt,need,pace,prio:PRIO[g.prio]?g.prio:'media'};
}
function goalsSorted(){const F=fin();return F.goals.slice().sort((a,b)=>{const A=goalInfo(a),B=goalInfo(b);
  return PRIO_ORDER.indexOf(A.prio)-PRIO_ORDER.indexOf(B.prio)||(A.left<=0)-(B.left<=0)||(A.mt?0:-1)-(B.mt?0:-1)||(A.mt||0)-(B.mt||0)||F.goals.indexOf(a)-F.goals.indexOf(b)})}
/* Reparte dentro de un nivel: primero llena en orden las metas sin fecha (la primera
   se llena primero), luego lo que las metas con fecha necesitan este mes, y lo que
   quede va a las de fecha. Devuelve lo que no se pudo usar. */
function fillTier(goals,amount,acc){
  let rest=amount;const room=g=>goalInfo(g).left-(acc.get(g)||0);const give=(g,x)=>{x=Math.min(x,room(g),rest);if(x>0){acc.set(g,(acc.get(g)||0)+x);rest-=x}};
  goals.filter(g=>!goalInfo(g).mt).forEach(g=>give(g,rest));
  goals.filter(g=>goalInfo(g).mt).sort((a,b)=>goalInfo(a).mt-goalInfo(b).mt).forEach(g=>give(g,Math.ceil(goalInfo(g).need)));
  goals.filter(g=>goalInfo(g).mt).forEach(g=>give(g,rest));
  return rest;
}
function allocSave(amount){
  const open=fin().goals.filter(g=>goalInfo(g).left>0);if(!open.length||amount<=0)return [];
  const tiers=PRIO_ORDER.map(k=>({k,gs:goalsSorted().filter(g=>goalInfo(g).left>0&&goalInfo(g).prio===k)}));
  const acc=new Map();
  const active=tiers.filter(t=>t.gs.length&&PRIO[t.k].share>0);
  const totShare=active.reduce((a,t)=>a+PRIO[t.k].share,0);
  let leftover=0;
  active.forEach(t=>{leftover+=fillTier(t.gs,Math.round(amount*PRIO[t.k].share/totShare),acc)});
  leftover+=amount-active.reduce((a,t)=>a+Math.round(amount*PRIO[t.k].share/totShare),0);
  for(const t of tiers){if(leftover<=0)break;if(t.gs.length)leftover=fillTier(t.gs,leftover,acc)}
  const out=[...acc.entries()].map(([g,a])=>({g,a:Math.round(a)})).filter(x=>x.a>0);
  return out;
}
function incPlan(m){
  if(m.plan)return m.plan;

}
function monthState(mk){
  const F=fin();mk=mk||curMonth();
  const mv=F.moves.filter(x=>monthKey(x.date)===mk);
  const ins=mv.filter(x=>x.type==='in');const inc=ins.reduce((a,x)=>a+x.amount,0);
  const plan=ins.reduce((a,x)=>{const p=incPlan(x);Object.keys(a).forEach(k=>a[k]+=p[k]||0);return a},{fixed:0,card:0,debt:0,save:0,needs:0,own:0});
  const outs=mv.filter(x=>x.type==='out');
  const isFixed=x=>x.fixedId||x.fixedPaid;
  const needsSpent=outs.filter(x=>moveKind(x)==='needs'&&!isFixed(x)).reduce((a,x)=>a+x.amount,0)+mv.filter(x=>x.type==='use'&&x.from==='needs').reduce((a,x)=>a+x.amount,0);
  const fixedSpent=outs.filter(isFixed).reduce((a,x)=>a+x.amount,0);
  const ownSpent=outs.filter(x=>moveKind(x)==='own').reduce((a,x)=>a+x.amount,0);
  const d=new Date();const daysLeft=mk===curMonth()?new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-d.getDate()+1:0;
  const byCat={};outs.forEach(x=>{const k=x.cat||'Otro';byCat[k]=(byCat[k]||0)+x.amount});
  return {inc,plan,needsSpent,fixedSpent,ownSpent,needsBud:plan.needs,ownBud:plan.own,needsLeft:plan.needs-needsSpent,ownLeft:plan.own-ownSpent,daysLeft,byCat,
    paid:mv.filter(x=>x.type==='debt').reduce((a,x)=>a+x.amount,0),saved:mv.filter(x=>x.type==='save').reduce((a,x)=>a+x.amount,0)};

/* Reparto en cascada: obligaciones que faltan → tarjeta → porcentajes con lo que queda */
function splitPlan(a){
  const F=fin(),O=obligations();
  const E=expectedIncome(),so=monthState().inc;
  const remainingInc=Math.max(E-so,a);
  const need=O.fixed+O.card;
  const pct=need>0?Math.min(1,need/remainingInc):0;
  const ob=Math.round(a*pct);
  const fixed=need>0?Math.round(ob*O.fixed/need):0;const cardA=ob-fixed;let r=a-ob;
  const tg=debtTargets()[0];const prio=tg&&tg.priority;
  const s=F.split;const tot=s.debt+s.save+s.needs+s.own||100;
  let debt=tg?Math.round(r*s.debt/tot):0,save=Math.round(r*(s.save+(tg?0:s.debt))/tot);
  if(prio){debt=Math.min(tg.balance,debt+save);save=Math.round(r*(s.save+s.debt)/tot)-debt;if(save<0)save=0}
  const needs=Math.round(r*s.needs/tot);const own=Math.max(0,r-debt-save-needs);
  return {fixed,card:cardA,debt,save,needs,own,target:tg?tg.id:null,targetName:tg?tg.name:'',prio:!!prio,pct:Math.round(pct*100),E};
}
function shortfalls(){
  const F=fin(),c=card(),today=dkey(new Date()),out=[];
  if(c&&c.minPay>0&&c.nextDue&&daysBetween(today,c.nextDue)<=7&&F.env.card<c.minPay)out.push({what:'card',label:`pagar la tarjeta ${c.nextDue<today?'(ya se venció)':'el '+niceDate(c.nextDue)}`,short:c.minPay-F.env.card});
  const d=new Date(),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  const fp=fixedPendingTotal();
  if(last-d.getDate()<=5&&fp>F.env.fixed)out.push({what:'fixed',label:'cubrir tus pagos fijos del mes',short:fp-F.env.fixed});
  return out;
}

function finRef(type,ref){const F=fin();return type==='debt'?F.debts.find(d=>d.id===ref):type==='save'?F.goals.find(g=>g.id===ref):null}
function addMove(m){
  const F=fin();m.id=m.id||uid();
  const r=finRef(m.type,m.ref);
  if(r&&m.type==='save')r.saved+=m.amount;
  const F2=fin();
  if(m.type==='out'&&(m.fixedId||m.fixedPaid)){m.envUsed=Math.min(F2.env.fixed,m.amount);F2.env.fixed-=m.envUsed}
  if(r&&m.type==='debt'){
    if(r.kind==='card'){m.envUsed=Math.min(F2.env.card,m.amount);F2.env.card-=m.envUsed;let left=m.amount;m.alloc=[];for(const p of r.purchases.slice().sort((a,b)=>a.date.localeCompare(b.date))){if(left<=0)break;const x=Math.min(left,p.left);p.left-=x;left-=x;m.alloc.push([p.id,x])}cardRecalc(r)}
    else r.balance-=m.amount;
  }
  F.moves.push(m);
  if(F.moves.length>800)F.moves=F.moves.slice(-800);
}
function delMove(id){
  const F=fin();const m=F.moves.find(x=>x.id===id);if(!m)return;
  (m.linked||[]).forEach(l=>delMove(l));
  const r=finRef(m.type,m.ref);
  if(r&&m.type==='save')r.saved-=m.amount;
  if(m.applied){F.env.fixed=Math.max(0,F.env.fixed-(m.applied.fixed||0));F.env.card=Math.max(0,F.env.card-(m.applied.card||0))}
  if(m.envUsed){if(m.type==='debt')F.env.card+=m.envUsed;else F.env.fixed+=m.envUsed}
  if(m.envAdd){F.env.fixed=Math.max(0,F.env.fixed-(m.envAdd.fixed||0));F.env.card=Math.max(0,F.env.card-(m.envAdd.card||0))}
  if(m.borrowed){const b=F.debts.find(d=>d.id===m.borrowed);if(b){b.balance-=m.amount;b.original=Math.max(0,(b.original||0)-m.amount);if(b.balance<=0)F.debts=F.debts.filter(d=>d!==b)}}
  if(r&&m.type==='debt'){if(r.kind==='card'){(m.alloc||[]).forEach(([pid,x])=>{const p=(r.purchases||[]).find(p=>p.id===pid);if(p)p.left+=x});cardRecalc(r)}else r.balance+=m.amount}
  if(m.cardPid){const c=card();if(c){c.purchases=(c.purchases||[]).filter(p=>p.id!==m.cardPid);cardRecalc(c)}}
  if(m.fixedPaid){const mp=F.fixedPaid[monthKey(m.date)];if(mp)delete mp[m.fixedPaid]}
  F.moves=F.moves.filter(x=>x.id!==id);
}
