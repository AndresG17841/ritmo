<style>
/* Layout: una columna tranquila (máx. 720px), navegación fija abajo, una sola cosa grande arriba: "Ahora". */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunk:#E3E9E6; --ink:#17201D; --muted:#5A6863; --line:#D3DCD8;
  --accent:#1E6B5B; --accent-soft:#D3EAE3; --accent-ink:#FFFFFF;
  --warm:#B8681F; --warm-soft:#F5E2CC; --risk:#B03E36; --risk-soft:#F6DCD9; --ok:#2C7A4B; --ok-soft:#DAEEDF;
  --night:#4A4E9C; --night-soft:#E1E2F4; --class:#2B4C78; --class-soft:#DCE5F1; --neutral-soft:#E7EAE8;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#17201D; --sunk:#111917; --ink:#E4ECE9; --muted:#97A7A1; --line:#2A3632;
  --accent:#62C3AB; --accent-soft:#1B3A33; --accent-ink:#06150F;
  --warm:#E5A35F; --warm-soft:#3A2A19; --risk:#EB8279; --risk-soft:#3D1F1C; --ok:#72C793; --ok-soft:#18321F;
  --night:#A5A9F2; --night-soft:#23254A; --class:#9DBDE8; --class-soft:#1C2A3E; --neutral-soft:#1F2926;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#17201D; --sunk:#111917; --ink:#E4ECE9; --muted:#97A7A1; --line:#2A3632;
  --accent:#62C3AB; --accent-soft:#1B3A33; --accent-ink:#06150F;
  --warm:#E5A35F; --warm-soft:#3A2A19; --risk:#EB8279; --risk-soft:#3D1F1C; --ok:#72C793; --ok-soft:#18321F;
  --night:#A5A9F2; --night-soft:#23254A; --class:#9DBDE8; --class-soft:#1C2A3E; --neutral-soft:#1F2926;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px calc(92px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(1.9rem,6vw,2.6rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.mono,.time{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.clock{font-family:var(--mono);font-size:1rem;color:var(--muted)}
.sync{font-size:.78rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--ok)} .dot.warn{background:var(--warm)}

/* Ahora */
.now{border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);background:var(--surface)}
.now .kind{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.now h2{font-size:clamp(1.6rem,5.5vw,2.2rem)}
.now.t-task{background:var(--accent-soft);border-color:transparent}.now.t-task .kind{color:var(--accent)}
.now.t-rest,.now.t-free,.now.t-open{background:var(--ok-soft);border-color:transparent}.now.t-rest .kind,.now.t-free .kind,.now.t-open .kind{color:var(--ok)}
.now.t-class{background:var(--class-soft);border-color:transparent}.now.t-class .kind{color:var(--class)}
.now.t-sleep,.now.t-wind{background:var(--night-soft);border-color:transparent}.now.t-sleep .kind,.now.t-wind .kind{color:var(--night)}
.now.t-commit,.now.t-job{background:var(--warm-soft);border-color:transparent}.now.t-commit .kind,.now.t-job .kind{color:var(--warm)}
.now.t-commute,.now.t-meal,.now.t-routine{background:var(--neutral-soft);border-color:transparent}
.timer{font-family:var(--mono);font-size:clamp(2.4rem,10vw,3.4rem);font-variant-numeric:tabular-nums;line-height:1}
.ideas{display:flex;gap:8px;flex-wrap:wrap}
.idea{font-size:.85rem;padding:4px 10px;border-radius:99px;background:var(--surface);color:var(--muted)}

/* Botones */
button,.btn{font:inherit;font-weight:700;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;cursor:pointer;min-height:44px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ghost{background:transparent}
.danger{color:var(--risk)}
.small{min-height:34px;padding:6px 10px;font-size:.88rem}
.chip{border-radius:99px;min-height:36px;padding:6px 12px;font-weight:400;font-size:.92rem}
.chip.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.quick button{text-align:left;display:flex;flex-direction:column;gap:2px;padding:12px 14px}
.quick button span{font-weight:400;font-size:.82rem;color:var(--muted)}
.quick button.on{background:var(--warm-soft);border-color:var(--warm)}

/* Timeline */
.tl{display:flex;flex-direction:column;gap:6px}
.blk{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:stretch}
.blk .t{font-family:var(--mono);font-size:.82rem;color:var(--muted);padding-top:10px;font-variant-numeric:tabular-nums}
.blk .b{border-radius:11px;padding:9px 12px;background:var(--neutral-soft);min-width:0;display:flex;flex-direction:column;gap:2px}
.blk .b strong{font-weight:700}
.blk .b small{color:var(--muted)}
.blk.past{opacity:.5}
.blk.cur .b{outline:2px solid var(--ink)}
.b.t-task{background:var(--accent-soft)} .b.t-class{background:var(--class-soft)} .b.t-rest,.b.t-free,.b.t-open{background:var(--ok-soft)}
.b.t-sleep,.b.t-wind{background:var(--night-soft)} .b.t-commit,.b.t-job{background:var(--warm-soft)}
.b.t-open{background:transparent;border:1px dashed var(--line)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.days button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 12px;font-weight:400}
.days button b{font-family:var(--display);font-size:1.2rem}
.days button.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Tareas */
.task{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.pill{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.p-bien{background:var(--ok-soft);color:var(--ok)} .p-ajustado{background:var(--warm-soft);color:var(--warm)}
.p-riesgo{background:var(--risk-soft);color:var(--risk)} .p-casi{background:var(--class-soft);color:var(--class)}
.p-ej{background:var(--sunk);color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter{position:relative;display:grid;grid-template-columns:40% 30% 30%;height:10px;border-radius:99px;overflow:visible;margin-top:4px}
.meter .z{display:block;height:100%}.meter .z1{background:var(--ok-soft);border-radius:99px 0 0 99px}.meter .z2{background:var(--warm-soft)}.meter .z3{background:var(--risk-soft);border-radius:0 99px 99px 0}
.meter i{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--ink)}
.meter-lab{display:grid;grid-template-columns:40% 30% 22% 8%;font-family:var(--mono);font-size:.7rem;color:var(--muted)}
.alert{border-radius:var(--r);padding:14px 16px;background:var(--risk-soft);color:var(--ink);display:flex;flex-direction:column;gap:6px}
.alert.warn{background:var(--warm-soft)}
.alert.calm{background:var(--accent-soft)}

/* Formularios */
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted);min-width:0;flex:none}
.grid2>label.f,.row>label.f{flex:1 1 140px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px;width:100%;min-width:0}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
.grid2{display:flex;gap:10px;flex-wrap:wrap}
.check{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:1rem;color:var(--ink);cursor:pointer}
.check:first-child{border-top:0}
.sched{display:grid;grid-template-columns:1.1fr .9fr .9fr 2fr 1fr auto;gap:6px;align-items:center;min-width:620px}
.scroll{overflow-x:auto}

/* Gráficas */
svg text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.hgrid{display:grid;grid-template-columns:150px repeat(14,1fr);gap:3px;align-items:center;font-size:.8rem;min-width:420px}
.hgrid i{display:block;aspect-ratio:1;border-radius:4px;background:var(--sunk);max-width:100%}
.hgrid i.y{background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--sunk);border-radius:12px;padding:12px}
.stat b{font-family:var(--display);font-size:1.6rem;display:block}

/* Avisos */
.pop-bg{position:fixed;inset:0;background:rgba(10,15,13,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.pop-bg.small{background:transparent;pointer-events:none;align-items:flex-end;justify-content:flex-end;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.pop{pointer-events:auto;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:18px;padding:20px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.pop-bg.small .pop{max-width:360px}
.pop .kind{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.pop-wind,.pop-bed{border-top-color:var(--night)}.pop-go{border-top-color:var(--warm)}.pop-soft{border-top-color:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center}
/* Pestañas internas */
.seg{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:13px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1 0 auto;border:0;background:transparent;color:var(--muted);min-height:38px;padding:6px 12px;font-size:.9rem;border-radius:10px}
.seg button.sel{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.catrow{display:grid;grid-template-columns:minmax(80px,30%) 1fr auto;gap:10px;align-items:center;font-size:.92rem}
.mini{width:110px;min-height:34px;padding:4px 8px}
.fixrow{gap:8px;padding:10px 0;border-top:1px solid var(--line)}.fixrow:first-child{border-top:0}
.gear{display:inline-flex;width:36px;height:36px;align-items:center;justify-content:center;border-radius:10px;color:var(--muted)}
.gear svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}.gear.sel,.gear:hover{color:var(--accent);background:var(--accent-soft)}
/* Navegación */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;color:var(--muted);text-decoration:none;font-size:.68rem;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs a.sel{color:var(--accent);background:var(--accent-soft)}

/* Hoja modal */
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,13,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px;
  padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:20px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:40;max-width:calc(100% - 32px);font-size:.92rem}
@media (prefers-reduced-motion:no-preference){.now,.card{animation:in .25s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
/* ===== Rediseño: lavanda suave, relieve, colores por tipo ===== */
:root{
  --bg:#ECEBFA; --surface:#F8F7FF; --sunk:#E4E2F6; --ink:#24224A; --muted:#6C6994; --line:#DCD9F1;
  --accent:#5B4FE0; --accent-soft:#E4E1FF; --accent-ink:#FFFFFF;
  --warm:#C96F17; --warm-soft:#FCEAD7; --risk:#CF3D55; --risk-soft:#FBE2E7; --ok:#16946B; --ok-soft:#DCF4EA;
  --night:#4B47B5; --night-soft:#E3E2F8; --class:#2A78C2; --class-soft:#DDEAFA; --neutral-soft:#E8E6F6;
  --shadow:0 12px 32px rgba(91,79,224,.11),0 2px 6px rgba(36,34,74,.06);
  --shadow-sm:0 4px 14px rgba(91,79,224,.10);
  --grad:linear-gradient(135deg,#5B4FE0 0%,#8F56EE 55%,#C065E2 100%);
  --display:"Outfit","Segoe UI",system-ui,sans-serif;
  --r:22px;
  --c-task:#6C5CE7; --c-class:#2F8BDB; --c-free:#1FAF83; --c-rest:#1FAF83; --c-open:#9C98C9; --c-commit:#EF8436; --c-job:#E2A92E;
  --c-sleep:#3D3A8F; --c-wind:#5B4FB8; --c-commute:#8C87C4; --c-meal:#E8668A; --c-routine:#F0B43C;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131129; --surface:#1E1B3C; --sunk:#181533; --ink:#ECEBFF; --muted:#A4A1CB; --line:#2E2A55;
  --accent:#8F86FF; --accent-soft:#2B2662; --accent-ink:#0F0D24;
  --warm:#F2A65A; --warm-soft:#3A2B1E; --risk:#FF7F91; --risk-soft:#3F1E2B; --ok:#5ED3A6; --ok-soft:#173A31;
  --night:#ACA8FF; --night-soft:#27245B; --class:#7FB9F3; --class-soft:#1B2D4A; --neutral-soft:#242046;
  --shadow:0 12px 32px rgba(0,0,0,.38),0 1px 0 rgba(255,255,255,.03) inset;
  --shadow-sm:0 4px 14px rgba(0,0,0,.3);
  --grad:linear-gradient(135deg,#4A3ECF 0%,#7447D9 55%,#A24CCB 100%);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131129; --surface:#1E1B3C; --sunk:#181533; --ink:#ECEBFF; --muted:#A4A1CB; --line:#2E2A55;
  --accent:#8F86FF; --accent-soft:#2B2662; --accent-ink:#0F0D24;
  --warm:#F2A65A; --warm-soft:#3A2B1E; --risk:#FF7F91; --risk-soft:#3F1E2B; --ok:#5ED3A6; --ok-soft:#173A31;
  --night:#ACA8FF; --night-soft:#27245B; --class:#7FB9F3; --class-soft:#1B2D4A; --neutral-soft:#242046;
  --shadow:0 12px 32px rgba(0,0,0,.38),0 1px 0 rgba(255,255,255,.03) inset;
  --shadow-sm:0 4px 14px rgba(0,0,0,.3);
  --grad:linear-gradient(135deg,#4A3ECF 0%,#7447D9 55%,#A24CCB 100%);
  color-scheme:dark}
body{padding-block:14px calc(110px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em}
h2{font-weight:600}

/* Cabecera con degradado */
.wrap>.top{flex-wrap:nowrap;align-items:flex-start!important;background:var(--grad);color:#fff;border-radius:28px;padding:20px 20px 22px;box-shadow:0 14px 34px rgba(91,79,224,.28);position:relative;overflow:hidden;align-items:center}
.wrap>.top::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
.wrap>.top::before{content:"";position:absolute;right:60px;bottom:-60px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.wrap>.top .label,.wrap>.top .clock,.wrap>.top .sync{color:rgba(255,255,255,.82)}
.wrap>.top h1{color:#fff}
.wrap>.top .gear{color:#fff;background:rgba(255,255,255,.16)}
.wrap>.top .gear.sel,.wrap>.top .gear:hover{background:rgba(255,255,255,.3);color:#fff}
.wrap>.top .dot.on{background:#8EF0C8}.wrap>.top .dot.warn{background:#FFD08A}

/* Tarjetas */
.stats{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
.card{border:0;box-shadow:var(--shadow);border-radius:var(--r);padding:20px}
.stat{background:var(--sunk);border-radius:16px;padding:14px}
.stat b{font-family:var(--display);font-weight:600}
.alert{border-radius:18px;box-shadow:var(--shadow-sm)}

/* Botones y campos */
button,.btn{border-radius:14px;border:0;background:var(--sunk);transition:transform .12s ease,box-shadow .12s ease}
button:hover{border-color:transparent;box-shadow:var(--shadow-sm)}
button:active{transform:scale(.97)}
.primary{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(91,79,224,.28)}
.ghost{background:transparent}
.chip{background:var(--sunk);border:0}
.chip.sel{background:var(--grad);color:#fff}
input,select,textarea{background:var(--sunk);border:1px solid transparent;border-radius:14px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.seg{background:var(--sunk);border-radius:16px}
.seg button{background:transparent;box-shadow:none}
.seg button.sel{background:var(--surface);box-shadow:var(--shadow-sm);color:var(--accent);font-weight:700}

/* Ahora: tarjeta grande con degradado por tipo */
.now{border:0;border-radius:28px;padding:24px;color:#fff;box-shadow:0 16px 36px rgba(91,79,224,.22);position:relative;overflow:hidden;background:linear-gradient(135deg,#8C87C4,#B3ACE6)}
.now::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)}
.now>*{position:relative;z-index:1}
.now .kind,.now.t-task .kind,.now.t-free .kind,.now.t-rest .kind,.now.t-open .kind,.now.t-class .kind,.now.t-sleep .kind,.now.t-wind .kind,.now.t-commit .kind,.now.t-job .kind{color:rgba(255,255,255,.85)}
.now .muted,.now .time{color:rgba(255,255,255,.85)}
.now.t-task{background:linear-gradient(135deg,#5B4FE0,#9B5CF0 60%,#C668E6)}
.now.t-class{background:linear-gradient(135deg,#2F7FD8,#4FB3E6)}
.now.t-free,.now.t-rest,.now.t-open{background:linear-gradient(135deg,#169F78,#4CCB9C)}
.now.t-commit,.now.t-job{background:linear-gradient(135deg,#EC7A32,#F5B44E)}

<script>
/*PLAN-START*/
const pad=n=>String(n).padStart(2,'0');
const toMin=s=>{if(!s)return 0;const[h,m]=String(s).split(':').map(Number);return h*60+(m||0)};
const fmt=m=>{m=Math.round(m);if(m>=1440)m-=1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d)};
const dow=k=>parseKey(k).getDay();
const daysBetween=(a,b)=>Math.round((parseKey(b)-parseKey(a))/864e5);
const clone=o=>JSON.parse(JSON.stringify(o));
const num=v=>{const x=parseFloat(String(v==null?'':v).replace(',','.'));return isNaN(x)?NaN:x};

const DEFAULTS={
  settings:{
    wakeWeekday:'06:30',wakeWeekend:'07:30',morningMin:60,restAfterU:45,bed:'22:30',screensOff:'22:00',
    commuteMin:20,commuteBuffer:10,freeMin:120,freeMinWeekend:180,freeStart:'20:00',
    lunchMin:60,dinnerMin:60,maxWork:240,maxWorkHeavy:120,chunkMax:90,breakMin:15,
    margin:1.5,bufferHours:24,
    job:{on:true,day:0,start:'08:00',end:'16:00',commute:30,pauseOnVacation:false},
    vacation:{on:false,from:'',to:''},
    holidays:['2026-11-02','2026-11-16','2026-12-08','2026-12-25','2027-01-01','2027-01-11']
  },
  schedule:[],
  commitments:[],
  habits:[
    {id:'screens',name:'Pantallas fuera a tiempo'},
    {id:'meals',name:'Tres comidas completas'},
    {id:'move',name:'Moverme 20 minutos'},
    {id:'water',name:'Tomar agua',remindEvery:150}
  ]
};
const CATS={taller:'Taller o ejercicios',informe:'Informe o escrito',parcial:'Estudiar para parcial',proyecto:'Proyecto',lectura:'Lectura',otro:'Otro'};

function mergeConfig(d){
  d=d||{};const S=Object.assign({},DEFAULTS.settings,d.settings||{});
  S.job=Object.assign({},DEFAULTS.settings.job,(d.settings||{}).job||{});
  S.vacation=Object.assign({},DEFAULTS.settings.vacation,(d.settings||{}).vacation||{});
  return {settings:S,schedule:d.schedule||[],commitments:d.commitments||[],habits:(d.habits&&d.habits.length)?d.habits:clone(DEFAULTS.habits)};
}

function occursOn(c,k){
  if(c.endDate)return k>=c.date&&k<=c.endDate;
  if(c.repeat==='weekly')return k>=c.date&&dow(k)===dow(c.date)&&!(c.skip||[]).includes(k);
  return c.date===k;
}

function freeIntervals(blocks,lo,hi){
  const s=blocks.filter(b=>b.end>lo&&b.start<hi).map(b=>[Math.max(lo,b.start),Math.min(hi,b.end)]).sort((a,b)=>a[0]-b[0]);
  const out=[];let cur=lo;
  for(const[a,b]of s){if(a>cur)out.push([cur,a]);cur=Math.max(cur,b)}
  if(cur<hi)out.push([cur,hi]);
  return out;
}
function placeFlex(blocks,lo,hi,durs,winA,winB,target){
  const iv=freeIntervals(blocks,lo,hi);
  for(const dur of durs){
    let best=null;
    for(let s=winA;s+dur<=winB;s+=15){
      if(iv.some(([a,b])=>s>=a&&s+dur<=b)){const sc=Math.abs(s-target);if(best===null||sc<best.sc)best={s,sc,dur}}
    }
    if(best)return [best.s,best.s+best.dur];
  }
  return null;
}

function factorFor(cat,tasks,S){
  const K=3;const prior=+S.margin||1.5;
  const done=tasks.filter(t=>t.done&&t.cat===cat&&t.estMin>0&&t.actualMin>0&&!t.example);
  const sum=done.reduce((a,t)=>a+Math.min(4,Math.max(.5,t.actualMin/t.estMin)),0);
  return {f:(prior*K+sum)/(K+done.length),n:done.length};
}
function spentMin(t,active,nowMs){
  let m=(t.sessions||[]).reduce((a,s)=>a+(s.min||0),0);
  if(active&&active.taskId===t.id)m+=Math.max(0,(nowMs-active.start)/60000);
  return m;
}
function remainingMin(t,f,active,nowMs){
  const sp=spentMin(t,active,nowMs);
  if(t.leftOverride!=null)return Math.max(0,t.leftOverride-(sp-(t.overrideSpent||0)));
  return Math.max(0,t.estMin*f-sp);
}

function learnedCommute(trips,dir,d){
  const ok=(trips||[]).filter(t=>t.dir===dir&&t.min>=3&&t.min<=180);
  let pick=ok.filter(t=>t.dow===d).slice(-8);
  if(pick.length<2)pick=ok.slice(-10);
  if(pick.length<(pick.every(t=>t.dow===d)&&pick.length>=2?2:3))return null;
  const avg=pick.reduce((a,t)=>a+t.min,0)/pick.length;
  return {min:Math.ceil(avg/5)*5,n:pick.length};
}
function habitPings(L,cfg){
  const out=[];
  for(const h of cfg.habits||[]){
    const ev=+h.remindEvery;if(!(ev>=30))continue;
    for(let m=L.wake+30;m<=L.screens-30;m+=ev){
      if(L.blocks.some(b=>b.type==='sleep'&&m>=b.start&&m<b.end))continue;
      out.push({min:m,id:h.id,name:h.name});
    }
  }
  return out.sort((a,b)=>a.min-b.min);
}
function planCfg(state){return Object.assign({},state.config,{_trips:(state.journal&&state.journal.commutes)||[]})}
function dayLayout(k,cfg,journal,clipFrom){
  const S=cfg.settings,d=dow(k);
  const vac=!!(S.vacation.on&&S.vacation.from&&S.vacation.to&&k>=S.vacation.from&&k<=S.vacation.to);
  const holiday=(S.holidays||[]).includes(k);
  const weekend=d===0||d===6;
  const relaxed=weekend||vac||holiday;
  const away=(cfg.commitments||[]).find(c=>c.endDate&&k>=c.date&&k<=c.endDate&&(k>c.date||toMin(c.start)<=toMin(relaxed?S.wakeWeekend:S.wakeWeekday))&&(k<c.endDate||toMin(c.end)>=toMin(S.screensOff)))||null;
  const Lida=learnedCommute(cfg._trips,'ida',d),Lvta=learnedCommute(cfg._trips,'vuelta',d);
  const goMin=Lida?Lida.min:+S.commuteMin,backMin=Lvta?Lvta.min:+S.commuteMin;
  const C=goMin+(+S.commuteBuffer);
  let wake=toMin(relaxed?S.wakeWeekend:S.wakeWeekday);
  const bed=toMin(S.bed),screens=Math.min(toMin(S.screensOff),bed);
  {const job=S.job;let firstOut=null;
   const cls=(vac||holiday||away)?[]:cfg.schedule.filter(c=>+c.day===d).map(c=>toMin(c.start));
   if(cls.length)firstOut=Math.min(...cls)-C;
   if(job.on&&d===+job.day&&!(vac&&job.pauseOnVacation)&&!away&&toMin(job.end)>toMin(job.start)){const jo=toMin(job.start)-(+job.commute||0);firstOut=firstOut==null?jo:Math.min(firstOut,jo)}
   if(firstOut!=null)wake=Math.max(240,Math.min(wake,firstOut-(+S.morningMin)));}
  const routineEnd=wake+(+S.morningMin);
  const B=[];
  B.push({start:0,end:wake,type:'sleep',title:'Dormir'});
  if(!away)B.push({start:wake,end:routineEnd,type:'routine',title:'Arrancar el día',sub:'Desayuno y alistarte sin afán'});
  let classMin=0,atUni=null;
  const classes=(vac||holiday||away)?[]:cfg.schedule.filter(c=>+c.day===d).map(c=>({start:toMin(c.start),end:toMin(c.end),name:c.name,room:c.room})).sort((a,b)=>a.start-b.start);
  for(const c of classes){classMin+=c.end-c.start;B.push({start:c.start,end:c.end,type:'class',title:c.name,sub:c.room||''})}
  if(classes.length){
    const first=classes[0].start,last=Math.max(...classes.map(c=>c.end));
    B.push({start:first-C,end:first,type:'commute',title:'Ir a la U',sub:`${goMin} min de camino${Lida?' (medido)':''} + ${S.commuteBuffer} de margen`});
    B.push({start:last,end:last+backMin,type:'commute',title:'Volver a casa',sub:Lvta?`${backMin} min (medido)`:''});
    const rest=+S.restAfterU||0;
    if(rest>0&&last+backMin+rest<=screens)B.push({start:last+backMin,end:last+backMin+rest,type:'rest',title:'Descanso al llegar',sub:'Protegido: comer algo, ducha, recostarte'});
    atUni=[first,last];
  }
  const job=S.job;
  if(job.on&&d===+job.day&&!(vac&&job.pauseOnVacation)&&!away&&toMin(job.end)>toMin(job.start)){
    const js=toMin(job.start),je=toMin(job.end),jc=+job.commute||0;
    if(jc)B.push({start:js-jc,end:js,type:'commute',title:'Ir al trabajo'});
    B.push({start:js,end:je,type:'job',title:'Trabajo',sub:'Domingo'});
    if(jc)B.push({start:je,end:je+jc,type:'commute',title:'Volver a casa'});
    {const rest=+S.restAfterU||0;if(rest>0&&je+jc+rest<=screens)B.push({start:je+jc,end:je+jc+rest,type:'rest',title:'Descanso al llegar',sub:'Protegido: recupérate del trabajo'});}
  }
  for(const c of cfg.commitments){
    if(!occursOn(c,k))continue;
    if(c.endDate){const s0=k===c.date?toMin(c.start):wake,e0=k===c.endDate?Math.min(toMin(c.end),screens):screens;
      if(e0>s0)B.push({start:Math.max(s0,wake),end:e0,type:'commit',title:c.label,sub:'Fuera de casa · sin tareas',cid:c.id});}
    else B.push({start:toMin(c.start),end:toMin(c.end),type:'commit',title:c.label,sub:c.open&&!c.done?'Duración estimada':c.repeat==='weekly'?'Cada semana':'Compromiso',cid:c.id,open:!!(c.open&&!c.done)});
  }
  B.push({start:screens,end:bed,type:'wind',title:'Soltar pantallas',sub:'Alista lo de mañana, ducha, luz baja'});
  B.push({start:bed,end:1440,type:'sleep',title:'Dormir'});
  // comidas y tiempo libre
  const lunch=placeFlex(B,routineEnd,screens,[+S.lunchMin,45,30],660,900,750);
  if(lunch)B.push({start:lunch[0],end:lunch[1],type:'meal',title:'Almuerzo',sub:atUni&&lunch[0]>=atUni[0]&&lunch[1]<=atUni[1]?'En la U':''});
  const dinner=placeFlex(B,routineEnd,screens,[+S.dinnerMin,45,30],1050,screens,1140);
  if(dinner)B.push({start:dinner[0],end:dinner[1],type:'meal',title:'Cena',sub:'Si te toca cocinar, aquí cabe'});
  const fm=relaxed?+S.freeMinWeekend:+S.freeMin;
  const free=placeFlex(B,routineEnd,screens,[fm,Math.round(fm*.75/15)*15,60,30],routineEnd,screens,toMin(S.freeStart));
  if(free)B.push({start:free[0],end:free[1],type:'free',title:'Tiempo libre',sub:'Protegido: nada de trabajo aquí'});
  // bloques disponibles para tareas
  const tired=!!(journal&&journal[k]&&journal[k].tired);
  let cap=tired?60:(classMin>=300?+S.maxWorkHeavy:+S.maxWork);
  const lo=Math.max(routineEnd,clipFrom==null?0:Math.ceil(clipFrom/5)*5);
  const iv=freeIntervals(B,lo,screens);
  const chunks=[],open=[];
  for(const[a,b]of iv){
    let cur=a;
    while(b-cur>=25&&cap>=25){
      const len=Math.min(+S.chunkMax,b-cur,cap);
      chunks.push({start:cur,end:cur+len,loc:atUni&&cur>=atUni[0]&&cur+len<=atUni[1]?'En la U':''});
      cap-=len;cur+=len;
      const br=Math.min(+S.breakMin,b-cur);
      if(br>0){open.push([cur,cur+br,'pausa']);cur+=br}
    }
    if(b-cur>=15)open.push([cur,b]);
  }
  return {k,d,vac,holiday,away,weekend,relaxed,wake,bed,screens,routineEnd,classMin,atUni,tired,cap0:tired?60:(classMin>=300?+S.maxWorkHeavy:+S.maxWork),blocks:B,chunks,open};
}

function buildPlan(state,now){
  const cfg=state.config,S=cfg.settings,today=dkey(now);
  const nowMin=now.getHours()*60+now.getMinutes(),nowMs=now.getTime();
  const all=state.tasks.items||[],active=state.tasks.active;
  const tasks=all.filter(t=>!t.done).map(t=>{
    const fr=factorFor(t.cat,all,S);
    const dl=daysBetween(today,t.dueDate)*1440+toMin(t.dueTime||'23:59');
    const need=Math.round(remainingMin(t,fr.f,active,nowMs)/5)*5;
    const tgt=dl-nowMin>(+S.bufferHours)*60*1.5?dl-(+S.bufferHours)*60:dl;
    return {t,id:t.id,f:fr.f,need,left:need,dl,tgt,sessions:[],lastEnd:null};
  });
  const maxDl=Math.max(0,...tasks.map(x=>x.dl));
  const horizon=Math.min(70,Math.max(14,Math.ceil(maxDl/1440)+1));
  const days=[];
  for(let i=0;i<horizon;i++){
    const k=addDays(today,i);
    const L=dayLayout(k,planCfg(state),state.journal.days,i===0?nowMin:null);
    L.i=i;
    for(const ch of L.chunks){
      let s=ch.start;const e=ch.end;
      while(e-s>=15){
        const abs=i*1440+s;
        const cand=tasks.filter(x=>x.left>0&&x.dl>abs&&!(x.t.waitingFor&&i===0)).sort((a,b)=>a.tgt-b.tgt||a.dl-b.dl);
        if(!cand.length)break;
        const x=cand[0];
        const len=Math.max(5,Math.min(e-s,x.left,x.dl-abs));
        L.blocks.push({start:s,end:s+len,type:'task',title:x.t.name,sub:ch.loc,taskId:x.id});
        x.sessions.push({k,start:s,end:s+len});
        x.left=Math.max(0,x.left-len);x.lastEnd=abs+len;s+=len;
        if(e-s<25)break;
      }
    }
    for(const[a,b]of freeIntervals(L.blocks,Math.max(L.routineEnd,i===0?Math.ceil(nowMin/5)*5:0),L.screens)){if(b-a>=20)L.blocks.push({start:a,end:b,type:'open',title:'Tiempo tuyo',sub:'Nada planeado'})}
    L.blocks.sort((a,b)=>a.start-b.start||a.end-b.end);
    L.pings=habitPings(L,cfg);
    days.push(L);
  }
  const info={};
  for(const x of tasks){
    let status='bien';
    if(x.need<=0)status='casi';
    else if(x.left>0)status='riesgo';
    else if(x.lastEnd>x.tgt)status='ajustado';
    info[x.id]={status,need:x.need,short:x.left,f:x.f,next:x.sessions[0]||null,sessions:x.sessions,dl:x.dl};
  }
  return {today,nowMin,days,info};
}
/*PLAN-END*/

async function flush(name){

function finishCommit(id,nowM){

/* --- tarjeta --- */
function card(){return fin().debts.find(d=>d.kind==='card')}
function cardDueFor(c,dateStr){
  const[y,m,d]=dateStr.split('-').map(Number);const cut=+c.cutDay||29,pay=Math.min(+c.payDay||18,28);
  const stmt=d<=cut?m-1:m;               // mes (0-11) del corte que incluye la compra
  return dkey(new Date(y,stmt+1,pay));    // se paga el mes siguiente al corte
}
function addMonths(k,n){const[y,m,d]=k.split('-').map(Number);return dkey(new Date(y,m-1+n,d))}
function cardOwedThrough(c,D){
  return (c.purchases||[]).reduce((a,p)=>{const n=p.cuotas||1,inst=p.amount/n,f=cardDueFor(c,p.date);let cnt=0;for(let i=0;i<n;i++){if(addMonths(f,i)<=D)cnt++;else break}
    return a+Math.max(0,Math.min(p.amount,inst*cnt)-(p.amount-p.left))},0);
}
function cardRecalc(c){
  c.purchases=(c.purchases||[]).filter(p=>p.left>0.5);
  c.balance=c.purchases.reduce((a,p)=>a+p.left,0);
  const dates=[...new Set(c.purchases.flatMap(p=>{const f=cardDueFor(c,p.date);return [...Array(p.cuotas||1)].map((_,i)=>addMonths(f,i))}))].sort();
  c.nextDue=null;c.minPay=0;
  for(const D of dates){const o=cardOwedThrough(c,D);if(o>0.5){c.nextDue=D;c.minPay=Math.round(o+c.purchases.filter(p=>p.cuotas>1).reduce((a,p)=>a+p.left,0)*(c.rate||0)/100);break}}
  if(!c.original||c.original<c.balance)c.original=c.balance;
}
function cardSplit(c){
  const one=(c.purchases||[]).filter(p=>p.cuotas<=1).reduce((a,p)=>a+p.left,0);
  const multi=(c.purchases||[]).filter(p=>p.cuotas>1);
  return {one,multi:multi.reduce((a,p)=>a+p.left,0),multiPay:multi.reduce((a,p)=>a+Math.min(p.left,p.amount/p.cuotas),0)};
}
function ensureCard(){
  const F=fin();let c=card();
  if(!c){c={id:uid(),kind:'card',name:'Tarjeta de crédito',balance:0,original:0,rate:0,minPay:0,cutDay:29,payDay:18,purchases:[]};F.debts.push(c)}
  return c;
}
function cutInfo(c){const t=dkey(new Date());const[y,m,d]=t.split('-').map(Number);const cut=+c.cutDay||29;const cd=d<=cut?new Date(y,m-1,Math.min(cut,new Date(y,m,0).getDate())):new Date(y,m,Math.min(cut,new Date(y,m+1,0).getDate()));return {cut:dkey(cd),payNow:cardDueFor(c,t)}}
function niceDate(k){const d=parseKey(k);return `${d.getDate()} ${MN[d.getMonth()].slice(0,3)}`}
/* deudas que cobran (excluye compras a 1 cuota) */
function realDebts(){
  return fin().debts.map(d=>{
    if(d.kind!=='card')return d.balance>0?{id:d.id,name:d.name,balance:d.balance,rate:d.rate||0,minPay:d.minPay||0}:null;
    const s=cardSplit(d);return s.multi>0?{id:d.id,name:d.name+' (a cuotas)',balance:s.multi,rate:d.rate||0,minPay:Math.round(s.multiPay)}:null;
  }).filter(Boolean);
}
function debtTargets(){
  const ds=fin().debts.filter(d=>d.kind!=='card'&&d.balance>0);
  const pr=ds.filter(d=>d.priority),rest=ds.filter(d=>!d.priority);
  fin().strategy==='bola'?rest.sort((a,b)=>a.balance-b.balance):rest.sort((a,b)=>(b.rate||0)-(a.rate||0)||a.balance-b.balance);
  return pr.concat(rest);
}
function debtOrder(){
  const ds=realDebts();const pr=ds.filter(d=>{const x=fin().debts.find(y=>y.id===d.id);return x&&x.priority});const rest=ds.filter(d=>!pr.includes(d));
  fin().strategy==='bola'?rest.sort((a,b)=>a.balance-b.balance):rest.sort((a,b)=>(b.rate||0)-(a.rate||0)||a.balance-b.balance);
  return pr.concat(rest);
}
function payoffMonths(balance,ratePct,pay){
  if(!(pay>0))return null;let b=balance,m=0;const r=(ratePct||0)/100;
  while(b>0&&m<600){const nb=b*(1+r)-pay;if(nb>=b)return Infinity;b=nb;m++}
  return m;
}
function payoffAll(monthly){
  const ds=debtOrder().map(d=>({b:d.balance,r:d.rate/100,min:d.minPay}));
  if(!ds.length)return 0;if(!(monthly>0))return null;

  while(ds.some(d=>d.b>0)&&m<600){
    ds.forEach(d=>{if(d.b>0)d.b*=1+d.r});
    let left=monthly;
    ds.forEach(d=>{if(d.b>0){const p=Math.min(d.b,d.min,left);d.b-=p;left-=p}});
    for(const d of ds){if(left<=0)break;if(d.b>0){const p=Math.min(d.b,left);d.b-=p;left-=p}}

/* --- pagos fijos --- */
function classFrac(mk){
  const V=state.config.settings.vacation||{};const[y,m]=mk.split('-').map(Number);const n=new Date(y,m,0).getDate();
  if(!(V.on&&V.from&&V.to))return 1;let c=0;for(let d=1;d<=n;d++){const k=mk+'-'+pad(d);if(!(k>=V.from&&k<=V.to))c++}
  return c/n;

function expectedIncome(){

  return Math.round((base+done.reduce((a,b)=>a+b,0))/(1+done.length));
}

  const outs=F.moves.filter(x=>(x.type==='out'&&moveKind(x)==='own')||(x.type==='use'&&x.from==='own')).reduce((a,x)=>a+x.amount,0);

      const est=r1000((x.amount||0)*classFrac(mk));return Object.assign({},x,{spent,est,expected:Math.max(est,spent)})}

/* --- metas --- */
function monthsTo(ym){if(!ym)return null;const[y,m]=ym.split('-').map(Number);const d=new Date();return Math.max(1,(y-d.getFullYear())*12+(m-1-d.getMonth()))}
function goalInfo(g){
  const left=Math.max(0,g.target-g.saved);const mt=monthsTo(g.deadline);
  const need=left<=0?0:mt?left/mt:null;
  const pace=monthlyAvg('save',g.id);
  return {left,mt,need,pace,prio:PRIO[g.prio]?g.prio:'media'};
}
function goalsSorted(){const F=fin();return F.goals.slice().sort((a,b)=>{const A=goalInfo(a),B=goalInfo(b);
  return PRIO_ORDER.indexOf(A.prio)-PRIO_ORDER.indexOf(B.prio)||(A.left<=0)-(B.left<=0)||(A.mt?0:-1)-(B.mt?0:-1)||(A.mt||0)-(B.mt||0)||F.goals.indexOf(a)-F.goals.indexOf(b)})}
/* Reparte dentro de un nivel: primero llena en orden las metas sin fecha (la primera
   se llena primero), luego lo que las metas con fecha necesitan este mes, y lo que
   quede va a las de fecha. Devuelve lo que no se pudo usar. */
function fillTier(goals,amount,acc){
  let rest=amount;const room=g=>goalInfo(g).left-(acc.get(g)||0);const give=(g,x)=>{x=Math.min(x,room(g),rest);if(x>0){acc.set(g,(acc.get(g)||0)+x);rest-=x}};
  goals.filter(g=>!goalInfo(g).mt).forEach(g=>give(g,rest));
  goals.filter(g=>goalInfo(g).mt).sort((a,b)=>goalInfo(a).mt-goalInfo(b).mt).forEach(g=>give(g,Math.ceil(goalInfo(g).need)));
  goals.filter(g=>goalInfo(g).mt).forEach(g=>give(g,rest));
  return rest;
}
function allocSave(amount){
  const open=fin().goals.filter(g=>goalInfo(g).left>0);if(!open.length||amount<=0)return [];
  const tiers=PRIO_ORDER.map(k=>({k,gs:goalsSorted().filter(g=>goalInfo(g).left>0&&goalInfo(g).prio===k)}));
  const acc=new Map();
  const active=tiers.filter(t=>t.gs.length&&PRIO[t.k].share>0);
  const totShare=active.reduce((a,t)=>a+PRIO[t.k].share,0);
  let leftover=0;
  active.forEach(t=>{leftover+=fillTier(t.gs,Math.round(amount*PRIO[t.k].share/totShare),acc)});
  leftover+=amount-active.reduce((a,t)=>a+Math.round(amount*PRIO[t.k].share/totShare),0);
  for(const t of tiers){if(leftover<=0)break;if(t.gs.length)leftover=fillTier(t.gs,leftover,acc)}
  const out=[...acc.entries()].map(([g,a])=>({g,a:Math.round(a)})).filter(x=>x.a>0);
  return out;
}

function monthState(mk){

  const byCat={};outs.forEach(x=>{const k=x.cat||'Otro';byCat[k]=(byCat[k]||0)+x.amount});

    paid:mv.filter(x=>x.type==='debt').reduce((a,x)=>a+x.amount,0),saved:mv.filter(x=>x.type==='save').reduce((a,x)=>a+x.amount,0)};

/* Reparto en cascada: obligaciones que faltan → tarjeta → porcentajes con lo que queda */
function splitPlan(a){
  const F=fin(),O=obligations();
  const E=expectedIncome(),so=monthState().inc;
  const remainingInc=Math.max(E-so,a);
  const need=O.fixed+O.card;
  const pct=need>0?Math.min(1,need/remainingInc):0;
  const ob=Math.round(a*pct);
  const fixed=need>0?Math.round(ob*O.fixed/need):0;const cardA=ob-fixed;let r=a-ob;
  const tg=debtTargets()[0];const prio=tg&&tg.priority;
  const s=F.split;const tot=s.debt+s.save+s.needs+s.own||100;
  let debt=tg?Math.round(r*s.debt/tot):0,save=Math.round(r*(s.save+(tg?0:s.debt))/tot);
  if(prio){debt=Math.min(tg.balance,debt+save);save=Math.round(r*(s.save+s.debt)/tot)-debt;if(save<0)save=0}
  const needs=Math.round(r*s.needs/tot);const own=Math.max(0,r-debt-save-needs);
  return {fixed,card:cardA,debt,save,needs,own,target:tg?tg.id:null,targetName:tg?tg.name:'',prio:!!prio,pct:Math.round(pct*100),E};
}

}

    </div>

function doPay(){
  const F=fin(),P=UI.pay,T=payTarget(P),today=dkey(new Date());
  const el=document.getElementById('p-amt');const amt=parseMoney(el?el.value:P.amount);if(!(amt>0)){toast('Escribe cuánto pagaste.');return}
  const fromEnv=Math.min(T.env,amt),rest=amt-fromEnv;const src=P.src||'own';const linked=[];
  let main;
  if(P.kind==='fixed'){const x=F.fixed.find(f=>f.id===P.id);main={type:'out',kind:'needs',amount:amt,date:today,cat:x.name,note:'Pago fijo',fixedPaid:x.id};addMove(main);(F.fixedPaid[curMonth()]=F.fixedPaid[curMonth()]||{})[x.id]=main.id}
  else{main={type:'debt',amount:Math.min(amt,T.max||amt),date:today,ref:P.id,note:'Pago'};addMove(main)}
  if(rest>0){
    if(src==='save'){let need=rest;const gsel=document.getElementById('p-goal');const gs=goalsSorted().filter(g=>g.saved>0);if(gsel)gs.sort((a,b)=>(b.id===gsel.value)-(a.id===gsel.value));
      for(const g of gs){if(need<=0)break;const x=Math.min(need,g.saved);const m={type:'save',amount:-x,date:today,ref:g.id,note:'Usado para pagar '+T.name};addMove(m);linked.push(m.id);need-=x}
      if(need>0){const m={type:'use',from:'own',amount:need,date:today,note:'Para pagar '+T.name};F.moves.push(Object.assign(m,{id:uid()}));linked.push(m.id)}var extraOwn=need>0?need:0}
    else{const m={id:uid(),type:'use',from:src,amount:rest,date:today,note:'Para pagar '+T.name};F.moves.push(m);linked.push(m.id)}
  }
  main.linked=linked;UI.pay=null;save('finance');render();
  const parts=[];if(fromEnv>0)parts.push(`${money(fromEnv)} de lo apartado`);
  if(rest>0){if(src==='save'){const eo=typeof extraOwn==='number'?extraOwn:0;if(rest-eo>0)parts.push(`${money(rest-eo)} de tus ahorros`);if(eo>0)parts.push(`${money(eo)} de lo tuyo (no alcanzó el ahorro)`)}else parts.push(`${money(rest)} ${src==='own'?'de lo tuyo':'del día a día'}`)}
  toast(`Pagaste ${money(amt)}: ${parts.join(', ')}.`);
}

      <p class="muted">Con lo que de verdad te vaya entrando lo ajusto: hoy calculo con <b>${money(expectedIncome())}</b>. Con eso decido qué porcentaje de cada ingreso va a obligaciones.</p></section>
    <section class="card"><h3>Agregar pago fijo</h3><form id="f-fixed" class="stack"><div class="grid2"><label class="f">Qué<input id="x-name" autocomplete="off" placeholder="Ej: Internet"></label><label class="f">Cuánto al mes<input id="x-amt" inputmode="numeric" placeholder="Ej: 20.000"></label><label class="f">Día de pago<input id="x-day" inputmode="numeric" placeholder="Opcional"></label></div>

    const S4=F.split.debt+F.split.save+F.split.needs+F.split.own;
    h+=`<section class="card"><h2>Cómo reparto lo que te entra</h2>
    <div class="grid2"><label class="f">Deudas %<input data-fin="split.debt" inputmode="numeric" value="${F.split.debt}"></label><label class="f">Ahorro %<input data-fin="split.save" inputmode="numeric" value="${F.split.save}"></label><label class="f">Día a día %<input data-fin="split.needs" inputmode="numeric" value="${F.split.needs}"></label><label class="f">Para ti %<input data-fin="split.own" inputmode="numeric" value="${F.split.own}"></label></div>
    ${S4!==100?`<p class="danger">Suman ${S4}%. Ajústalos para que den 100%.</p>`:''}
    <p class="muted">Estos porcentajes se aplican a lo que queda <b>después</b> de apartar tus pagos fijos y el próximo pago de la tarjeta. Si no tienes otras deudas, la parte de deudas se va al ahorro. Si tienes una deuda prioritaria (como un préstamo de tu novia), recibe lo de deudas y lo de ahorro hasta saldarla.</p>
    <span class="label">Qué deuda pagar primero</span>
    <div class="row"><button class="chip ${F.strategy==='avalancha'?'sel':''}" data-act="fin-strat" data-v="avalancha">La de más interés</button><button class="chip ${F.strategy==='bola'?'sel':''}" data-act="fin-strat" data-v="bola">La más pequeña</button></div>
    <p class="muted">${F.strategy==='avalancha'?'Pagando primero la de más interés, en total pagas menos intereses.':'Pagando primero la más pequeña, terminas deudas más rápido y ves avances antes.'}</p></section>`;
  }
  return h;
}

function finRef(type,ref){const F=fin();return type==='debt'?F.debts.find(d=>d.id===ref):type==='save'?F.goals.find(g=>g.id===ref):null}
function addMove(m){
  const F=fin();m.id=m.id||uid();
  const r=finRef(m.type,m.ref);
  if(r&&m.type==='save')r.saved+=m.amount;
  const F2=fin();
  if(m.type==='out'&&(m.fixedId||m.fixedPaid)){m.envUsed=Math.min(F2.env.fixed,m.amount);F2.env.fixed-=m.envUsed}
  if(r&&m.type==='debt'){
    if(r.kind==='card'){m.envUsed=Math.min(F2.env.card,m.amount);F2.env.card-=m.envUsed;let left=m.amount;m.alloc=[];for(const p of r.purchases.slice().sort((a,b)=>a.date.localeCompare(b.date))){if(left<=0)break;const x=Math.min(left,p.left);p.left-=x;left-=x;m.alloc.push([p.id,x])}cardRecalc(r)}
    else r.balance-=m.amount;
  }
  F.moves.push(m);
  if(F.moves.length>800)F.moves=F.moves.slice(-800);
}
function delMove(id){
  const F=fin();const m=F.moves.find(x=>x.id===id);if(!m)return;
  (m.linked||[]).forEach(l=>delMove(l));
  const r=finRef(m.type,m.ref);
  if(r&&m.type==='save')r.saved-=m.amount;
  if(m.applied){F.env.fixed=Math.max(0,F.env.fixed-(m.applied.fixed||0));F.env.card=Math.max(0,F.env.card-(m.applied.card||0))}
  if(m.envUsed){if(m.type==='debt')F.env.card+=m.envUsed;else F.env.fixed+=m.envUsed}
  if(m.envAdd){F.env.fixed=Math.max(0,F.env.fixed-(m.envAdd.fixed||0));F.env.card=Math.max(0,F.env.card-(m.envAdd.card||0))}
  if(m.borrowed){const b=F.debts.find(d=>d.id===m.borrowed);if(b){b.balance-=m.amount;b.original=Math.max(0,(b.original||0)-m.amount);if(b.balance<=0)F.debts=F.debts.filter(d=>d!==b)}}
  if(r&&m.type==='debt'){if(r.kind==='card'){(m.alloc||[]).forEach(([pid,x])=>{const p=(r.purchases||[]).find(p=>p.id===pid);if(p)p.left+=x});cardRecalc(r)}else r.balance+=m.amount}
  if(m.cardPid){const c=card();if(c){c.purchases=(c.purchases||[]).filter(p=>p.id!==m.cardPid);cardRecalc(c)}}
  if(m.fixedPaid){const mp=F.fixedPaid[monthKey(m.date)];if(mp)delete mp[m.fixedPaid]}
  F.moves=F.moves.filter(x=>x.id!==id);
}
function finAction(act,el){
  const F=fin(),id=el.dataset.id,today=dkey(new Date());
  switch(act){
    case 'out-kind':UI.outKind=el.dataset.v;UI.preCat=null;render();return;
    case 'pay-with':UI.payWith=el.dataset.v;render();return;
    case 'fin-go':{const t=el.dataset.t;UI.sub.plata='registrar';UI.finType=t;render();if(t==='buy'){const b=document.getElementById('b-name');if(b)b.focus()}else{const a=document.getElementById('fin-amt');if(a)a.focus()}return}
    case 'buy-kind':UI.buyKind=el.dataset.v;if(UI.buy){UI.buy.kind=el.dataset.v}render();return;
    case 'buy-yes':{const C=UI.buy;addMove({type:'out',kind:C.kind,amount:C.price,date:today,cat:C.kind==='own'?'Gustos':'Otro',note:C.name||'Compra'});UI.buy=null;save('finance');render();toast('Anotado como gasto.');return}
    case 'buy-wait':{const C=UI.buy;F.wish.push({id:uid(),name:C.name,price:C.price,kind:C.kind,at:Date.now()});UI.buy=null;save('finance');render();toast('Listo. Te pregunto mañana si todavía lo quieres.');return}
    case 'buy-no':{F.skipped+=UI.buy.price;UI.buy=null;save('finance');render();toast('Buena decisión. Lo sumo a lo que te has ahorrado.');return}
    case 'wish-buy':{const w=F.wish.find(x=>x.id===id);if(w)addMove({type:'out',kind:w.kind||'own',amount:w.price,date:today,cat:'Gustos',note:w.name||'Compra'});F.wish=F.wish.filter(x=>x.id!==id);save('finance');render();toast('Anotado como gasto.');return}
    case 'wish-drop':{const w=F.wish.find(x=>x.id===id);if(w)F.skipped+=w.price;F.wish=F.wish.filter(x=>x.id!==id);save('finance');render();toast('Te ahorraste '+money(w?w.price:0)+'.');return}
    case 'short-save':{const want=+el.dataset.v;let need=want;const ms=F.moves.filter(m=>m.type==='save'&&monthKey(m.date)===curMonth()).sort((a,b)=>b.date.localeCompare(a.date));let got=0;
      for(const m of ms){if(need<=0)break;const x=Math.min(need,m.amount);addMove({type:'save',amount:-x,date:today,ref:m.ref,note:'Usado para '+(el.dataset.w==='card'?'la tarjeta':'pagos fijos')});need-=x;got+=x}
      F.env[el.dataset.w]+=got;UI.usedSave=got;save('finance');render();toast(`Moví ${money(got)} del ahorro al apartado.`);return}
    case 'short-borrow':{const amt=+el.dataset.v||0;if(!(amt>0))return;let b=F.debts.find(d=>d.priority&&d.kind!=='card'&&/novia/i.test(d.name));
      if(!b){b={id:uid(),name:'Préstamo de mi novia',balance:0,original:0,rate:0,minPay:0,dueDay:null,priority:true};F.debts.push(b)}
      b.balance+=amt;b.original=(b.original||0)+amt;F.env[el.dataset.w]+=amt;UI.usedSave=0;
      F.moves.push({id:uid(),type:'loan',amount:amt,date:today,note:'Préstamo de mi novia',borrowed:b.id,envAdd:{[el.dataset.w]:amt}});
      save('finance');render();toast('Anotado. Esa deuda va primero cuando te entre plata.');return}
    case 'sweep':{const v=+el.dataset.v;addMove({type:'save',amount:v,date:today,ref:el.dataset.g||'',note:'Lo que sobró del mes'});F.swept[el.dataset.m]=true;save('finance');render();toast(`Pasé ${money(v)} al ahorro.`);return}
    case 'sweep-no':F.swept[el.dataset.m]=true;save('finance');render();return;
    case 'pay-open':{UI.pay={kind:el.dataset.k,id,src:'own'};UI.split=null;UI.sub.plata=UI.sub.plata||'resumen';render();window.scrollTo&&window.scrollTo(0,0);return}
    case 'pay-src':{const a=document.getElementById('p-amt');if(a)UI.pay.amount=parseMoney(a.value);UI.pay.src=el.dataset.v;const g=document.getElementById('p-goal');if(g)UI.pay.goal=g.value;render();return}
    case 'pay-cancel':UI.pay=null;render();return;
    case 'pay-go':doPay();return;
    case 'fix-pay':{const x=F.fixed.find(f=>f.id===id);if(!x)return;const mk=curMonth();const m={type:'out',kind:'needs',amount:x.amount,date:today,cat:x.name,note:'Pago fijo',fixedPaid:x.id};addMove(m);(F.fixedPaid[mk]=F.fixedPaid[mk]||{})[x.id]=m.id;save('finance');render();toast(`${x.name}: pagado.`);return}
    case 'fix-undo':{const mk=curMonth();const v=(F.fixedPaid[mk]||{})[id];if(typeof v==='string')delMove(v);if(F.fixedPaid[mk])delete F.fixedPaid[mk][id];save('finance');render();return}
    case 'fix-add':{UI.sub.plata='registrar';UI.finType='out';UI.outKind='needs';UI.payWith='cash';UI.preCat='fx:'+id;render();const a=document.getElementById('fin-amt');if(a)a.focus();return}
    case 'fix-del':{if(UI.confirmDel===id){F.fixed=F.fixed.filter(x=>x.id!==id);UI.confirmDel=null;save('finance')}else UI.confirmDel=id;render();return}
  }
}
function finSet(el){
  const F=fin();
  if(el.dataset.debtset){const[id,k]=el.dataset.debtset.split('.');const d=F.debts.find(x=>x.id===id);if(!d)return;
    if(k==='dueDay'){const n=parseInt(el.value,10);d.dueDay=n>=1&&n<=31?Math.min(n,28):null}else d[k]=Math.max(0,num(el.value)||0);
    if(d.kind==='card')cardRecalc(d);save('finance');render();toast('Guardado');return true}
  if(el.dataset.goalset){const[id,k]=el.dataset.goalset.split('.');const g=F.goals.find(x=>x.id===id);if(!g)return;g[k]=el.value||null;save('finance');render();toast('Guardado');return true}
  return false;
}
function finForm(f){
  const F=fin();const err=id=>{const e=document.getElementById(id);return msg=>{e.textContent=msg;e.hidden=false}};
  if(f.id==='f-buy'){
    const price=parseMoney(document.getElementById('b-price').value);
    if(!(price>0))return err('b-err')('Escribe cuánto cuesta.');
    UI.buy={name:document.getElementById('b-name').value.trim(),price,kind:UI.buyKind||'own'};render();return;
  }
  if(f.id==='f-fin'){
    const T=UI.finType||'in';const amt=parseMoney(document.getElementById('fin-amt').value);
    if(!(amt>0))return err('fin-err')('Escribe cuánto, por ejemplo 150.000.');
    const refEl=document.getElementById('fin-ref');const ref=refEl?refEl.value:'';
    if(T==='debt'&&!ref)return err('fin-err')('No tienes deudas pendientes.');
    const K=UI.outKind||'needs';const date=document.getElementById('fin-date').value||dkey(new Date());const note=document.getElementById('fin-note').value.trim();
    const before=T==='out'?monthState():null;
    const m={type:T,amount:amt,date,note,ref};
    if(T==='in')m.plan=splitPlan(amt);
    if(T==='out'){m.kind=K;let cat=document.getElementById('fin-cat').value;
      if(cat.startsWith('fx:')){const fx=F.fixed.find(x=>x.id===cat.slice(3));m.fixedId=cat.slice(3);cat=fx?fx.name:'Universidad'}m.cat=cat;
      if(UI.payWith==='card'){const c=ensureCard();const n=+document.getElementById('fin-cuotas').value||1;const p={id:uid(),date,amount:amt,cuotas:n,left:amt,note:note||cat};c.purchases=c.purchases||[];c.purchases.push(p);cardRecalc(c);m.pay='card';m.cardPid=p.id}}
    addMove(m);
    save('finance');if(T==='in')UI.split={amount:amt,plan:m.plan,moveId:m.id};UI.preCat=null;render();
    let msg=T==='in'?'Anotado. Mira cómo repartirlo.':T==='debt'?'Pago anotado. La deuda bajó.':T==='save'?'Ahorro anotado.':m.pay==='card'?'Gasto anotado y sumado a la tarjeta.':'Gasto anotado.';
    if(T==='out'&&before&&before.inc>0){const left=(K==='own'?before.ownLeft:before.needsLeft)-amt;if(left<0)msg=`Anotado, pero te pasaste ${money(-left)} de tu presupuesto ${K==='own'?'para ti':'de obligatorios'}.`}
    toast(msg);if(T==='in'&&window.scrollTo)window.scrollTo(0,0);return;
  }
  if(f.id==='f-debt'){
    const name=document.getElementById('d-name').value.trim(),bal=parseMoney(document.getElementById('d-bal').value);
    if(!name||!(bal>0))return err('d-err')('Escribe a quién le debes y cuánto.');
    const day=parseInt(document.getElementById('d-day').value,10);
    F.debts.push({id:uid(),name,balance:bal,original:bal,rate:Math.max(0,num(document.getElementById('d-rate').value)||0),minPay:parseMoney(document.getElementById('d-min').value),dueDay:day>=1&&day<=31?Math.min(day,28):null});
    save('finance');render();toast('Deuda agregada.');return;
  }
  if(f.id==='f-goal'){
    const name=document.getElementById('g-name').value.trim(),tg=parseMoney(document.getElementById('g-target').value);
    if(!name||!(tg>0))return err('g-err')('Escribe la meta y cuánto quieres juntar.');
    F.goals.push({id:uid(),name,target:tg,saved:parseMoney(document.getElementById('g-saved').value),prio:document.getElementById('g-prio').value,deadline:document.getElementById('g-deadline').value||null});
    save('finance');render();toast('Meta agregada.');return;
  }
  if(f.id==='f-fixed'){
    const name=document.getElementById('x-name').value.trim(),amt=parseMoney(document.getElementById('x-amt').value),v=document.getElementById('x-var').checked;
    if(!name||(!v&&!(amt>0)))return err('x-err')(v?'Escribe el nombre.':'Escribe el nombre y cuánto pagas al mes.');
    const day=parseInt(document.getElementById('x-day').value,10);
    F.fixed.push({id:uid(),name,amount:amt,day:day>=1&&day<=31?Math.min(day,28):null,variable:v});
    save('finance');render();toast('Pago fijo agregado.');return;
  }
}

function render(){
  const tab=UI.tab;
  document.querySelector('nav.tabs').hidden=!!UI.auth;
  const fabEl=document.getElementById('fab');if(fabEl)fabEl.hidden=!!UI.auth;
  if(UI.auth){const n0=new Date();document.getElementById('pagetitle').textContent='Ritmo';document.getElementById('dateline').textContent=longDate(dkey(n0));document.getElementById('clock').textContent=fmt(n0.getHours()*60+n0.getMinutes());setSync('','Entra para sincronizar');document.getElementById('view').innerHTML=vLogin();return}
  document.querySelectorAll('nav.tabs a').forEach(a=>a.classList.toggle('sel',a.dataset.tab===tab));
  const titles={ahora:'Ahora',dia:'Tu día',tareas:'Tareas',bien:'Bienestar',plata:'Finanzas',ajustes:'Ajustes'};
  document.getElementById('pagetitle').textContent=titles[tab];
  const now=new Date();
  document.getElementById('dateline').textContent=longDate(dkey(now));
  document.getElementById('clock').textContent=fmt(now.getHours()*60+now.getMinutes());
  plan();
  const v={ahora:vAhora,dia:vDia,tareas:vTareas,bien:vBien,plata:vPlata,ajustes:vAjustes}[tab]();
  document.querySelector('.gear').classList.toggle('sel',tab==='ajustes');
  document.getElementById('view').innerHTML=v;
  tick();updatePreview();
}
function softRender(){
  const a=document.activeElement;
  if(a&&a.closest&&(a.closest('#view')||a.closest('#sheet'))&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;
  if(UI.finishing||UI.adjusting)return;
  render();
}
function tick(){
  document.querySelectorAll('[data-elapsed]').forEach(el=>{const s=Math.floor((Date.now()-(+el.dataset.elapsed))/1000);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;el.textContent=(h?h+':'+pad(m):pad(m))+':'+pad(x)});
}
function updatePreview(){
  const el=document.getElementById('t-prev');if(!el)return;
  const est=num(document.getElementById('t-est').value)||0;const cat=document.getElementById('t-cat').value;

}

function handleForm(f){
  if(f.id==='f-login')return doAuth('login');
  if(f.id==='f-pay')return doPay();
  if(['f-fin','f-debt','f-goal','f-buy','f-fixed'].includes(f.id))return finForm(f);
  if(f.id==='f-task'){
    const err=document.getElementById('t-err');
    const name=document.getElementById('t-name').value.trim();
    const dueDate=document.getElementById('t-date').value;
    const est=num(document.getElementById('t-est').value);
    const msg=!name?'Escribe qué tienes que hacer.':!/^\d{4}-\d{2}-\d{2}$/.test(dueDate)?'Elige la fecha de entrega.':!(est>0)?'Escribe cuántas horas crees que te toma (por ejemplo 1,5).':'';
    if(msg){err.textContent=msg;err.hidden=false;return}
    const t={id:uid(),name,cat:document.getElementById('t-cat').value,dueDate,dueTime:document.getElementById('t-time').value||'23:59',estMin:Math.max(15,Math.round(est*60)),created:new Date().toISOString(),sessions:[]};
    state.tasks.items.push(t);save('tasks');render();
    const I=PLAN.info[t.id];
    toast(I&&I.next?`Agregada. Empiezas ${relDay(I.next.k,PLAN.today)} a las ${fmt(I.next.start)}.`:'Agregada, pero no alcanza el tiempo. Mira la tarea.');
  }else if(f.id==='f-commit'){
    const label=document.getElementById('c-label').value.trim()||'Compromiso';
    const s=UI.sheet;let c;
    if(s.mode==='now'){const n=new Date();const nm=Math.floor((n.getHours()*60+n.getMinutes())/5)*5;const S=state.config.settings;
      const end=s.durMin==='night'?toMin(S.screensOff):s.durMin==='open'?Math.min(1435,nm+estFor(label).min):Math.min(1435,nm+s.durMin);
      c={id:uid(),label,date:dkey(n),start:fmt(nm),end:fmt(Math.max(end,nm+15)),repeat:'none'};if(s.durMin==='open')c.open=true;}
    else if(s.mode==='trip'){const from=document.getElementById('c-from').value,to=document.getElementById('c-to').value;
      if(!from||!to||to<from)return toast('La fecha de regreso debe ser igual o después de la de salida.');
      c={id:uid(),label,date:from,start:document.getElementById('c-fromt').value||'00:00',endDate:to,end:document.getElementById('c-tot').value||'23:59',repeat:'none'};
      if(from===to&&toMin(c.end)<=toMin(c.start))return toast('La hora de regreso debe ser después de la de salida.');}
    else{c={id:uid(),label,date:document.getElementById('c-date').value,start:document.getElementById('c-start').value,end:document.getElementById('c-end').value,repeat:document.getElementById('c-weekly').checked?'weekly':'none'};
      if(document.getElementById('c-open').checked){c.open=true;c.end=fmt(Math.min(1435,toMin(c.start)+estFor(label).min))}}
    if(!c.endDate&&toMin(c.end)<=toMin(c.start))return toast('La hora final debe ser después de la inicial.');
    const today=dkey(new Date());
    state.config.commitments=state.config.commitments.filter(x=>x.repeat==='weekly'||daysBetween(x.endDate||x.date,today)<14);
    if(c.repeat==='weekly'&&c.open){c.open=false}
    state.config.commitments.push(c);save('config');UI.sheet=null;renderSheet();render();toast('Listo. Reacomodé tu plan.');
  }else if(f.dataset.form==='finish'){
    const id=f.dataset.id;const t=state.tasks.items.find(x=>x.id===id);const h=num(document.getElementById('fin-'+id).value)||0;
    markDone(t,h*60);UI.finishing=null;save('tasks');render();toast(t.example?'Tarea de ejemplo terminada.':'Anotado. Con esto ajusto tus próximos cálculos.');
  }else if(f.dataset.form==='edit-commit'){
    const c=state.config.commitments.find(x=>x.id===f.dataset.id);if(!c)return;
    const g=id=>{const e=document.getElementById(id);return e?e.value:''};
    const nc={label:g('ec-label').trim()||c.label,date:g('ec-date')||c.date,start:g('ec-start')||c.start,end:g('ec-end')||c.end};
    if(c.endDate){nc.endDate=g('ec-enddate')||c.endDate;if(nc.endDate<nc.date)return toast('El día de regreso debe ser igual o después del de salida.')}
    else{if(toMin(nc.end)<=toMin(nc.start))return toast('La hora final debe ser después de la inicial.');const w=document.getElementById('ec-weekly');nc.repeat=w&&w.checked?'weekly':'none'}
    if(c.open&&!c.done){nc.open=true}
    Object.assign(c,nc);UI.editCommit=null;save('config');render();toast('Cambios guardados. Reacomodé tu plan.');
  }else if(f.dataset.form==='edit-task'){
    const t=state.tasks.items.find(x=>x.id===f.dataset.id);if(!t)return;
    const name=document.getElementById('et-name').value.trim(),date=document.getElementById('et-date').value,est=num(document.getElementById('et-est').value);
    if(!name)return toast('Escribe el nombre de la tarea.');if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return toast('Elige la fecha de entrega.');if(!(est>0))return toast('Escribe cuántas horas crees que te toma.');
    const newEst=Math.max(15,Math.round(est*60));if(newEst!==t.estMin){delete t.leftOverride;delete t.overrideSpent}
    Object.assign(t,{name,cat:document.getElementById('et-cat').value,dueDate:date,dueTime:document.getElementById('et-time').value||'23:59',estMin:newEst});
    UI.editTask=null;save('tasks');render();toast('Tarea actualizada. Recalculé el plan.');
  }else if(f.dataset.form==='waiting'){
    const id=f.dataset.id;const t=state.tasks.items.find(x=>x.id===id);const who=document.getElementById('wait-'+id).value.trim()||'alguien';
    t.waitingFor=who;t.waitingSince=dkey(new Date());UI.waiting=null;save('tasks');render();toast(`Anotado. Hoy no te pongo bloques; escríbele a ${who}.`);
  }else if(f.dataset.form==='adjust'){
    const id=f.dataset.id;const t=state.tasks.items.find(x=>x.id===id);const h=num(document.getElementById('adj-'+id).value);if(!(h>=0))return toast('Escribe un número de horas, por ejemplo 2,5.');
    t.leftOverride=Math.round(h*60);t.overrideSpent=spentMin(t,null,Date.now());UI.adjusting=null;save('tasks');render();toast('Recalculado.');
  }
}

const NOTI={day:null,shown:{},snoozed:[],current:null};
const DESK=window.ritmoDesktop||null;
function alertsFor(P){
  const T=P.days[0];const out=[];if(!T)return out;
  for(const b of T.blocks){
    if(b.type==='task'){
      const t=state.tasks.items.find(x=>x.id===b.taskId);
      out.push({key:`task:${b.taskId}:${b.start}`,at:b.start,kind:'task',big:true,title:`Toca: ${b.title}`,body:`Bloque de ${dur(b.end-b.start)}, hasta las ${fmt(b.end)}${b.sub?' · '+b.sub:''}.`,taskId:b.taskId,end:b.end,
        buttons:[['start','Empiezo'],['snooze10','En 10 min'],['cant','No puedo ahora']]});
      if(t)out.push({key:`taskend:${b.taskId}:${b.end}`,at:b.end,kind:'taskend',big:false,onlyIfActive:b.taskId,title:'Se acabó el bloque',body:`${b.title}. Descansa unos minutos.`,buttons:[['pause','Pausar y guardar'],['snooze15','Sigo 15 min más']]});
    }
    if(b.type==='commute'&&/^Ir /.test(b.title))out.push({key:`go:${b.start}`,at:b.start-5,kind:'go',big:true,title:'Sal en 5 minutos',body:`${b.title}: si sales a las ${fmt(b.start)} llegas sin correr.`,buttons:[['left','Ya salgo'],['snooze5','En 5 min']]});
    if(b.type==='wind')out.push({key:'wind',at:b.start,kind:'wind',big:true,title:'Pantallas fuera',body:`A las ${fmt(b.end)} a la cama. Lo de mañana ya está en el plan.`,end:b.end,buttons:[['ok','Entendido'],['shutdown',`Apagar el PC a las ${fmt(b.end)}`],['snooze10','En 10 min']]});
    if(b.type==='sleep'&&b.start>0)out.push({key:'bed',at:b.start,kind:'bed',big:true,title:'A la cama',body:'Ya es hora de dormir. Todo lo pendiente tiene su espacio.',buttons:[['ok','Buenas noches']]});
    if(b.type==='free')out.push({key:`free:${b.start}`,at:b.start,kind:'soft',big:false,title:'Tiempo libre, sin culpa',body:`Este rato es tuyo, hasta las ${fmt(b.end)}.`,buttons:[['ok','Gracias']]});
    if(b.type==='rest')out.push({key:`rest:${b.start}`,at:b.start,kind:'soft',big:false,title:'Descanso al llegar',body:`No tienes que hacer nada hasta las ${fmt(b.end)}.`,buttons:[['ok','Gracias']]});
  }
  for(const g of T.pings||[])out.push({key:`ping:${g.id}:${g.min}`,at:g.min,kind:'ping',big:false,pingId:g.id,pingMin:g.min,title:g.id==='water'?'Toma un vaso de agua':g.name,body:'Un minuto y sigues.',buttons:[['ping-ok','Listo'],['snooze20','En 20 min']]});
  return out;
}
function checkAlerts(){
  if(UI.auth||NOTI.current)return;
  const P=plan();const now=P.nowMin;
  if(NOTI.day!==P.today){NOTI.day=P.today;NOTI.shown=lsGet('noti.'+P.today)||{}}
  const T=P.days[0];if(T&&T.away)return;
  const nowMs=Date.now();
  let a=null;const sIdx=NOTI.snoozed.findIndex(s=>s.until<=nowMs);
  if(sIdx>=0){a=NOTI.snoozed[sIdx].a;NOTI.snoozed.splice(sIdx,1)}
  else{
    const act=state.tasks.active;
    a=alertsFor(P).filter(x=>!NOTI.shown[x.key]&&x.at<=now&&now<x.at+10)
      .filter(x=>!(x.kind==='task'&&act&&act.taskId===x.taskId))
      .filter(x=>!x.onlyIfActive||(act&&act.taskId===x.onlyIfActive))
      .filter(x=>x.kind!=='ping'||!(((state.journal.days[P.today]||{}).pingDone||{})[x.pingId]>=x.pingMin))
      .sort((x,y)=>(y.big-x.big)||(x.at-y.at))[0]||null;
    if(a){NOTI.shown[a.key]=1;lsSet('noti.'+P.today,NOTI.shown)}
  }
  if(a)showAlert(a);
}
function showAlert(a){
  NOTI.current=a;
  if(DESK){DESK.popup({key:a.key,title:a.title,body:a.body,big:a.big,kind:a.kind,buttons:a.buttons});return}
  const el=document.getElementById('popup');
  el.innerHTML=`<div class="pop-bg ${a.big?'':'small'}"><div class="pop pop-${a.kind}" role="alertdialog" aria-label="${esc(a.title)}"><span class="kind">Ritmo · ${fmt(new Date().getHours()*60+new Date().getMinutes())}</span><h2>${esc(a.title)}</h2><p>${esc(a.body)}</p>
    <div class="row">${a.buttons.filter(b=>b[0]!=='shutdown').map((b,i)=>`<button class="${i===0?'primary':''}" data-act="alert" data-v="${b[0]}">${esc(b[1])}</button>`).join('')}</div></div></div>`;
  el.hidden=false;
  try{if(document.hidden&&'Notification' in window&&Notification.permission==='granted'){const n=new Notification(a.title,{body:a.body,tag:a.key,requireInteraction:a.big});n.onclick=()=>{window.focus();n.close()}}}catch(e){}
  try{if(a.big&&navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
  if(!a.big){clearTimeout(NOTI.autoClose);NOTI.autoClose=setTimeout(()=>{if(NOTI.current===a)alertAction('ok')},60000)}
}
function closeAlert(){NOTI.current=null;const el=document.getElementById('popup');if(el){el.hidden=true;el.innerHTML=''}setTimeout(checkAlerts,500)}
function alertAction(act){
  const a=NOTI.current;if(!a)return;
  const snooze=m=>NOTI.snoozed.push({a,until:Date.now()+m*60000});
  switch(act){
    case 'start':stopActive();state.tasks.active={taskId:a.taskId,start:Date.now()};save('tasks');if(DESK)DESK.show();location.hash='ahora';break;
    case 'cant':if(DESK)DESK.show();location.hash='ahora';setTimeout(openCommitSheet,50);break;
    case 'pause':{const t=stopActive();save('tasks');if(t)toast('Guardé tu sesión. Buen trabajo.');break}
    case 'left':state.journal.commuteActive={leftAt:Date.now(),dir:'ida'};save('journal');break;
    case 'ping-ok':{const k=dkey(new Date());const J=state.journal.days[k]=state.journal.days[k]||{};J.pingDone=J.pingDone||{};J.pingDone[a.pingId]=a.pingMin;J.count=J.count||{};J.count[a.pingId]=(J.count[a.pingId]||0)+1;J.habits=J.habits||{};J.habits[a.pingId]=true;save('journal');break}
    case 'shutdown':if(DESK){const secs=Math.max(60,Math.round(((a.end||0)-(new Date().getHours()*60+new Date().getMinutes()))*60));DESK.shutdownIn(secs);toast('El PC se apaga a la hora de dormir. Para cancelar: Ajustes → Cancelar apagado.')}break;
    default:{const m=/^snooze(\d+)$/.exec(act);if(m)snooze(+m[1])}
  }
  closeAlert();render();
}
if(DESK&&DESK.onAction)DESK.onAction(({key,act})=>{if(NOTI.current&&NOTI.current.key===key)alertAction(act)});
setInterval(checkAlerts,20000);
function notifPermissionCard(){
  if(DESK)return `<section class="card"><h2>Avisos</h2><p>Estás en Ritmo para Windows: los avisos salen en una ventana encima de todo, aunque tengas la app cerrada en la bandeja.</p><div class="row"><button class="small" data-act="test-alert">Probar un aviso</button><button class="small ghost" data-act="cancel-shutdown">Cancelar apagado programado</button></div></section>`;
  const p=('Notification' in window)?Notification.permission:'unsupported';
  return `<section class="card"><h2>Avisos</h2><p class="muted">Mientras tengas Ritmo abierto, te aviso con una ventana dentro de la app${p==='granted'?' y con una notificación del sistema si está en segundo plano':''}.</p>
    <div class="row">${p==='default'?'<button class="small primary" data-act="ask-notif">Permitir notificaciones</button>':''}<button class="small" data-act="test-alert">Probar un aviso</button></div></section>`;
}
